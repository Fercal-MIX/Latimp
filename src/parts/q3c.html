<script>
/* ---------- Etapa 2: categorii noi, aniversări, bani, kilometri, taxe, adăugare din text, documente atașate, calendar, widget ---------- */
const PAIDG=["fac","casa","san","doc","fis"],GORD=["sub","fac","auto","casa","san","doc","fis","per"];
Object.assign(GN,{fac:"Facturi",casa:"Casă",san:"Sănătate",doc:"Documente",fis:"Taxe"});
const XT={
 fac:[["cur","Curent",1],["gaz","Gaz",1],["apa","Apă",1],["net","Internet și TV",1],["tel","Telefon",1],["chi","Chirie",1],["int","Întreținere",1],["xf","Altă factură",1]],
 casa:[["cen","Verificare centrală",24],["igz","Verificare instalație gaz",24],["pad","Asigurare PAD",12],["asl","Asigurare locuință",12],["cos","Coș de fum",12],["acd","Aer condiționat",12],["fil","Filtre apă",6],["xc","Altceva",0]],
 san:[["den","Stomatolog",6],["anl","Analize",12],["ofl","Oftalmolog",12],["med","Control medical",12],["vac","Vaccin animal",12],["dep","Deparazitare",3],["vet","Veterinar",12],["xs","Altceva",0]],
 doc:[["ci","Carte de identitate",0],["pas","Pașaport",0],["pc","Permis de conducere",0],["cb","Card bancar",0],["xd","Alt document",0]],
 fis:[["imp","Impozit local",12],["imp2","Impozit local, rata a doua",12],["du","Declarația unică",12],["xt","Altă taxă",12]]};
Object.values(XT).forEach(l=>l.forEach(a=>TYN[a[0]]=a[1]));
TYN.onom="Onomastică";TYN.anv="Aniversare";if(!PT.some(a=>a[0]=="onom"))PT.splice(1,0,["onom",12],["anv",12]);
const NL={fac:"Furnizor (opțional)",casa:"Detalii (opțional)",san:"Pentru cine (opțional)",doc:"Al cui (opțional)",fis:"Detalii (opțional)"};
const PH2={fac:"De exemplu: Enel, Digi",casa:"De exemplu: apartament, casa de la țară",san:"De exemplu: Ana sau Rex",doc:"De exemplu: Ana",fis:"De exemplu: apartament"};
const DONE={auto:"Am reînnoit",doc:"Am reînnoit",fac:"Am plătit",fis:"Am plătit",casa:"Am făcut",san:"Am făcut"};
const TIP={
 cen:"De obicei, verificarea centralei se face la 2 ani, de o firmă autorizată. Intervalul exact e în contractul de service.",
 igz:"Verificarea instalației de gaz se face de regulă la 2 ani, iar revizia la 10 ani. Confirmă intervalul la furnizorul de gaz.",
 pad:"Asigurarea obligatorie a locuinței (PAD) se reînnoiește în fiecare an.",
 imp:"Dacă plătești tot impozitul până la 31 martie, primăria poate acorda o reducere. Verifică la primăria ta.",
 imp2:"A doua rată a impozitului local are termen, de regulă, 30 septembrie.",
 du:"Declarația unică se depune, de regulă, până la 25 mai. Verifică termenul pe site-ul ANAF.",
 pas:"Pentru pașaport, alege un memento cu 1–2 luni înainte: programarea poate dura.",
 ci:"Pentru buletin, alege un memento cu o lună înainte.",
 cb:"Banca trimite de obicei cardul nou singură. Memento-ul te ajută să verifici că a ajuns."};
const mT=x=>{const r=x&&can("custom_reminder")&&x.rd!==undefined&&x.rd!==null&&x.rd!==""?+x.rd:NaN;return Math.max(1,isFinite(r)?r:maxT())};
const isOther=t=>/^x[a-z]$/.test(t||"");
const opts=(l,v)=>l.map(o=>`<option value="${o[0]}"${String(o[0])==String(v)?" selected":""}>${o[1]}</option>`).join("");
const nextOcc=(mo,d)=>{const t=td();let x=new Date(t.getFullYear(),mo,d);if(x<t)x=new Date(t.getFullYear()+1,mo,d);return fmt(x)};

/* ---- editor: grupuri, tipuri, câmpuri ---- */
function editItem(id,rn){
 if(!id&&!S.pro&&S.items.filter(x=>!x.ex).length>=FREE_ITEMS){toast("Ai atins limita gratuită de "+FREE_ITEMS+" de termene.");openPlan("agenda");return}
 if(!id&&PAIDG.includes(FIL)&&gate("cat_extra",GN[FIL]+" fac parte din Control."))return;
 const g=GORD.includes(FIL)?FIL:"sub";
 cur=id?{...S.items.find(i=>i.id==id)}:g=="sub"?{g:"sub",t:"sub",e:"📦",n:"",p:"",c:"m",d:plus(30),rep:0,note:""}:g=="auto"?{g:"auto",t:"itp",n:"",d:"",rep:24,note:""}:g=="per"?{g:"per",t:"zi",n:"",d:"",rep:12,auto:true,note:""}:{g,t:XT[g][0][0],n:"",d:"",rep:XT[g][0][2],note:"",p:""};
 if(id&&rn){cur.rn=1;cur.d=""}
 drawItem(!!id)}
function setG(k){
 if(PAIDG.includes(k)&&gate("cat_extra",GN[k]+" fac parte din Control."))return;
 grab();cur.g=k;if(k=="auto"){cur.n="";delete cur.car}
 if(XT[k]){cur.t=XT[k][0][0];cur.rep=XT[k][0][2];cur.auto=false}
 else{cur.t=k=="sub"?"sub":k=="auto"?"itp":"zi";cur.rep=k=="auto"?24:k=="per"?12:0;cur.auto=k=="per"}
 drawItem(false)}
function setT(k){
 grab();cur.t=k;
 const r=XT[cur.g]?(XT[cur.g].find(a=>a[0]==k)||[0,0,0])[2]:((cur.g=="auto"?AT:PT).find(a=>a[0]==k)||[0,0])[1];
 cur.rep=r;cur.auto=cur.g=="per"&&r>0;drawItem(!!cur.id)}
function grab(){
 const v=i=>{const e=$(i);return e?e.value:undefined};
 const n=v("f_n");if(n!==undefined)cur.n=n;const p=v("f_p");if(p!==undefined)cur.p=p;const c=v("f_c");if(c!==undefined)cur.c=c;
 const d=v("f_d");if(d!==undefined)cur.d=d;const r=v("f_rep");if(r!==undefined)cur.rep=+r;const nt=v("f_note");if(nt!==undefined)cur.note=nt;
 const mo=v("f_m");if(mo!==undefined){const mm=/^(\d{4})-(\d{2})$/.exec(mo);cur.d=mm?fmt(new Date(+mm[1],+mm[2],0)):""}
 const rd=v("f_rd");if(rd!==undefined)cur.rd=rd===""?null:+rd;
 const co=v("f_cost");if(co!==undefined)cur.p=co;
 const ki=v("f_kmi");if(ki!==undefined)cur.kmi=ki;const kl=v("f_kml");if(kl!==undefined)cur.kml=kl;
 const s=$("f_sh");if(s)cur.sh=s.checked}
function xtForm(c){
 const l=XT[c.g],other=isOther(c.t);
 let h=`<label>${c.g=="fac"?"Ce factură?":"Ce anume?"}</label><div class="chips">${l.map(a=>`<button class="${c.t==a[0]?"on":""}" onclick="setT('${a[0]}')">${a[1]}</button>`).join("")}</div>`;
 h+=`<label for="f_n">${other?"Nume":NL[c.g]}</label><input id="f_n" value="${esc(c.n||"")}" maxlength="40" placeholder="${PH2[c.g]}">`;
 if(c.g=="fac"||c.g=="fis")h+=`<label for="f_p">Sumă aproximativă (lei, opțional)</label><input id="f_p" type="number" inputmode="decimal" min="0" value="${esc(c.p==null?"":c.p)}">`;
 if(c.t=="cb")h+=`<label for="f_m">Expiră (luna și anul de pe card)</label><input id="f_m" type="month" value="${esc((c.d||"").slice(0,7))}"><div class="note">Scrie doar luna și anul. Numărul cardului nu se cere și nu trebuie scris nicăieri în aplicație.</div>`;
 else h+=`<label for="f_d">${c.g=="fac"?"Scadența":c.g=="doc"?"Expiră la":c.g=="fis"?"Termen de plată":"Data"}</label><input id="f_d" type="date" value="${esc(c.d||"")}">`;
 if(c.g!="fac")h+=`<label for="f_rep">Se repetă</label><select id="f_rep">${opts([[0,"Nu se repetă"],[1,"Lunar"],[3,"La 3 luni"],[6,"La 6 luni"],[12,"Anual"],[24,"La 2 ani"],[60,"La 5 ani"],[120,"La 10 ani"]],+c.rep||0)}</select>`;
 else h+=`<div class="note">Se repetă lunar. „Am plătit” mută scadența la luna următoare.</div>`;
 if(TIP[c.t])h+=`<div class="note">${TIP[c.t]}</div>`;
 if(c.g=="fis"&&!c.id)h+=`<button class="btn alt" onclick="fisPack()">Adaugă toate termenele fiscale obișnuite</button>`;
 return h}
/* onomastici: sfinții cu dată fixă cei mai des sărbătoriți */
const ONOM=[["Vasile",0,1],["Ion, Ioan, Ioana",0,7],["Haralambie",1,10],["Gheorghe, Georgiana",3,23],["Constantin, Elena",4,21],["Petru, Pavel",5,29],["Ilie",6,20],["Ana",6,25],["Maria, Marian",7,15],["Alexandru",7,30],["Paraschiva",9,14],["Dumitru",9,26],["Mihai, Gabriel",10,8],["Andrei",10,30],["Nicolae",11,6],["Ștefan",11,27]];
const onomSel=c=>`<label for="f_on">Sfântul (opțional)</label><select id="f_on" onchange="onomPick(this.value)"><option value="">Aleg eu data</option>${ONOM.map((o,i)=>`<option value="${i}">${o[0]}, ${o[2]} ${MON[o[1]]}.</option>`).join("")}</select><div class="note">Doar sărbătorile cu dată fixă. Pentru celelalte, alege data de mai jos.</div>`;
function onomPick(i){if(i==="")return;const o=ONOM[+i];if(!o)return;grab();cur.d=nextOcc(o[1],o[2]);cur.rep=12;cur.auto=true;if(!(cur.n||"").trim())cur.n=o[0].split(",")[0];drawItem(!!cur.id)}
function itemExtras(c){
 let h=fHid("custom_reminder")?"":`<label for="f_rd">Memento pentru acest termen${ptag("custom_reminder")}</label><select id="f_rd"${can("custom_reminder")?"":" disabled"}>${opts([["","Ca în Notificări"],[0,"În ziua termenului"],[1,"Cu o zi înainte"],[3,"Cu 3 zile înainte"],[7,"Cu o săptămână înainte"],[14,"Cu 2 săptămâni înainte"],[30,"Cu o lună înainte"],[60,"Cu 2 luni înainte"],[90,"Cu 3 luni înainte"]],c.rd==null?"":c.rd)}</select>`;
 if(c.g=="auto"&&(c.t=="ulei"||c.t=="rev")&&!fHid("car_km"))h+=`<div class="row"><div><label for="f_kmi">La câți km${ptag("car_km")}</label><input id="f_kmi" type="number" inputmode="numeric" min="0" max="100000" placeholder="15000" value="${esc(c.kmi==null?"":c.kmi)}"${can("car_km")?"":" disabled"}></div><div><label for="f_kml">Km la ultimul schimb</label><input id="f_kml" type="number" inputmode="numeric" min="0" max="2000000" value="${esc(c.kml==null?"":c.kml)}"${can("car_km")?"":" disabled"}></div></div>`;
 if(c.g=="auto"&&can("item_history"))h+=`<label for="f_cost">Cost (lei, opțional)</label><input id="f_cost" type="number" inputmode="decimal" min="0" value="${esc(c.p==null?"":c.p)}">`;
 return h+stepBox(c)+histBox(c)+attBox(c)}
function saveItem(ed){
 grab();const c=cur;
 if(!okDate(c.d)){toast(c.t=="cb"?"Alege luna și anul":"Alege o dată validă");return}
 if(XT[c.g]&&gate("cat_extra",GN[c.g]+" fac parte din Control."))return;
 if(c.g=="sub"){const p=parseFloat(c.p);if(!(c.n||"").trim()||!(p>=0)){toast("Completează numele și prețul");return}c.p=p}
 if((c.g=="per"||isOther(c.t))&&!(c.n||"").trim()){toast("Completează un nume");return}
 if(c.g=="auto"){
  if(c.car=="new"||!S.cars.some(z=>z.id==c.car)){
   const nm=(c.n||"").trim();if(!nm){toast("Completează numărul sau numele mașinii");return}
   let k=findCar(nm);
   if(!k){if(!S.pro&&S.cars.length>=FREE_CARS){toast("Planul gratuit are o singură mașină.");openPlan("agenda");return}k={id:uid(),n:nm.slice(0,30)};S.cars.push(k)}
   c.car=k.id}
  c.n=(S.cars.find(z=>z.id==c.car)||{}).n||""}
 const o={g:c.g,t:c.t,n:(c.n||"").trim(),d:c.d,note:(c.note||"").trim(),sh:!!c.sh&&c.g!="sub"};
 if(c.g=="sub"){o.e=c.e||"📦";o.p=c.p;o.c=c.c||"m";o.ad=pd(c.d).getDate()}
 else if(XT[c.g]){o.rep=c.g=="fac"?1:+c.rep||0;o.auto=false;o.ad=pd(c.d).getDate();const p=parseFloat(c.p);o.p=p>=0?Math.round(p*100)/100:null}
 else{o.rep=+c.rep||0;o.auto=c.g=="per"&&o.rep>0;if(o.auto)o.ad=pd(c.d).getDate();if(c.g=="auto")o.car=c.car;if(c.g=="auto"&&can("item_history")){const p=parseFloat(c.p);o.p=p>=0?Math.round(p*100)/100:null}}
 if(can("custom_reminder")){o.rd=c.rd===null||c.rd===undefined||c.rd===""||!isFinite(+c.rd)?null:Math.max(0,Math.min(365,+c.rd))}
 if(c.g=="auto"&&(c.t=="ulei"||c.t=="rev")&&can("car_km")){const i=Math.round(+c.kmi),l=Math.round(+c.kml);o.kmi=i>0&&i<=1e5?i:null;o.kml=c.kml!==""&&l>=0&&l<=2e6?l:null}
 if(ed){const x=S.items.find(i=>i.id==c.id);
  if(x.g=="sub"&&o.g=="sub"&&+x.p!==+o.p&&x.p!==undefined)x.ph=(Array.isArray(x.ph)?x.ph:[]).concat({d:fmt(td()),p:+x.p}).slice(-12);
  Object.assign(x,o);delete x.ex}
 else{const n={id:uid(),...o};if(n.g=="sub")n.uc=fmt(td());S.items.push(n);if(S.stats)S.st.adds=(S.st.adds||0)+1}
 save();closeSheet();render();toast(ed?"Salvat":"Adăugat în agendă")}
function fisPack(){
 if(gate("cat_extra"))return;
 const add=[["imp",2,31],["du",4,25],["imp2",8,30]];let n=0;
 add.forEach(([t,mo,d])=>{if(S.items.some(x=>x.g=="fis"&&x.t==t))return;S.items.push({id:uid(),g:"fis",t,n:"",d:nextOcc(mo,d),rep:12,auto:false,ad:d,note:"",sh:false,p:null});n++});
 save();closeSheet();FIL="fis";render();toast(n?"Am adăugat "+n+(n==1?" termen fiscal":" termene fiscale"):"Le ai deja în agendă")}

/* ---- listă: carduri, stare, reînnoire ---- */
function stat(x){
 const n=left(x.d),V={sub:"se reînnoiește",auto:"expiră",doc:"expiră",fac:"scadentă",fis:"de plătit",casa:"programat",san:"programat",per:"are loc"},v=V[x.g]||"are loc";
 if(n<0)return `<span class="st d">${x.g=="per"?"a trecut de":x.g=="fac"||x.g=="fis"?"întârziat de":"expirat de"} ${-n} ${-n==1?"zi":"zile"}</span>`;
 const w=n==0?"azi":n==1?"mâine":"în "+n+" zile";
 if(n<=mT(x))return `<span class="st ${n<=1?"d":"wa"}">${v} ${w}</span>`;
 return `<span>în ${n} zile</span>`}
function phTag(x){
 if(x.g!="sub"||!Array.isArray(x.ph)||!x.ph.length)return"";const l=x.ph[x.ph.length-1];
 if(!okDate(l.d)||(td()-pd(l.d))/DAY>60)return"";const df=Math.round((+x.p-(+l.p))*100)/100;
 return df>0?`<span class="tag wn">s-a scumpit cu ${money(df)} lei</span>`:df<0?`<span class="tag ok">s-a ieftinit cu ${money(-df)} lei</span>`:""}
function card(x,allow){
 const sub=x.g=="sub",xg=!!XT[x.g];
 const tg=x.ex?`<span class="tag">exemplu</span>`:x.g=="auto"?`<span class="tag k">Auto</span>`:x.g=="per"?`<span class="tag k">${esc(TYN[x.t]||"Personal")}</span>`:xg?`<span class="tag k">${esc(GN[x.g])}</span>`:"";
 const pr=sub?`<span class="pr">${money(x.p)} lei/${x.c=="m"?"lună":"an"}</span>`:xg&&+x.p>0?`<span class="pr">${money(+x.p)} lei</span>`:"";
 const prim=sub?`<button onclick="editItem('${x.id}')">Detalii</button><button class="g" onclick="mark('${x.id}')">${x.k?"Îl păstrez":"Marchează de anulat"}</button>`:x.g=="auto"||xg?`<button onclick="renew('${x.id}')">${DONE[x.g]}</button>`:!x.auto?`<button onclick="renew('${x.id}')">Gata</button>`:"";
 const gift=x.g=="per"&&["zi","onom","anv"].includes(x.t)&&left(x.d)>=0&&left(x.d)<=21&&CFG.flags.gifts!==false?`<button onclick="giftFor('${x.id}')">Idei de cadou</button>`:"";
 const att=Array.isArray(x.att)&&x.att.length?`<span class="tag">📎 ${x.att.length}</span>`:"";
 return `<div class="li" id="c_${x.id}" data-s="${sev(left(x.d))}">${leaf(x)}<div class="bd"><div class="top"><strong>${sub&&x.e?esc(x.e)+" ":""}${esc(ttl(x))}</strong>${pr}</div><div class="mt">${tg}${x.k?`<span class="tag ok">de anulat</span>`:""}${phTag(x)}${stepTag(x)}${att}${x.sh&&S.fam?`<span class="tag">distribuit</span>`:""}${stat(x)}</div>${kmLine(x)}${x.note?`<div class="mu" style="margin-top:4px">${esc(x.note)}</div>`:""}${sugg(x,allow)}<div class="acts">${prim}${gift}${personBtn(x)}${sub?"":`<button class="g" onclick="editItem('${x.id}')">Editează</button>`}</div></div></div>`}
function renew(id){
 const x=S.items.find(i=>i.id==id);if(!x)return;
 if(x.g=="auto"||XT[x.g]){
  const st=x.g=="fac"?1:+x.rep||0;
  if(st>0){let d;
   if(x.g=="fac"){d=addM(pd(x.d),1,+x.ad||pd(x.d).getDate());let i=0;while(d<td()&&i<120){d=addM(d,1,+x.ad||d.getDate());i++}}
   else{const b=left(x.d)>=0?pd(x.d):td();d=addM(b,st,b.getDate())}
   x.hist=(Array.isArray(x.hist)?x.hist:[]).concat({d:x.d,p:+x.p>0?+x.p:null,km:x.g=="auto"?(+(S.cars.find(z=>z.id==x.car)||{}).km||null):null}).slice(-20);
   if(Array.isArray(x.ss))x.ss.forEach(s=>s.dn=false);
   x.d=fmt(d);
   if(x.g=="auto"&&x.kmi){const k=S.cars.find(z=>z.id==x.car);if(k&&+k.km)x.kml=+k.km}
   save();render();flashCard(id);toast("Următorul termen: "+nice(x.d))}
  else editItem(id,true)}
 else if(x.g=="per"&&!x.auto){S.items=S.items.filter(i=>i.id!=id);save();render();toast("Gata, l-am scos din agendă")}}
function emptyX(){
 if(!can("cat_extra"))return fHid("cat_extra")?"":`<div class="card"><h3>${esc(GN[FIL])} fac parte din ${esc(planName("cat_extra"))}</h3><div class="mu" style="margin-top:4px">Facturi, casă, sănătate, documente și taxe, fiecare cu memento-ul lui.</div><button class="btn alt" onclick="gate('cat_extra')">Vezi ${esc(planName("cat_extra"))}</button></div>`;
 const H={fac:"Curent, gaz, internet, chirie: scadența și suma, cu „Am plătit”.",casa:"Verificarea centralei, asigurarea PAD, coșul de fum, filtrele.",san:"Stomatolog, analize, vaccinul și deparazitarea animalului.",doc:"Buletin, pașaport, permis, card bancar: când expiră.",fis:"Impozitul local și declarația unică, cu termenele obișnuite."};
 return `<div class="card"><h3>Nimic aici încă</h3><div class="mu" style="margin-top:4px">${H[FIL]||""}</div>${FIL=="fis"?`<button class="btn alt" onclick="fisPack()">Adaugă termenele fiscale obișnuite</button>`:""}</div>`}
function giftFor(id){const x=S.items.find(i=>i.id==id);if(!x)return;GIFT.occ=x.t=="onom"?"Onomastică":x.t=="anv"?"Aniversare":"Zi de naștere";GIFT.det=(x.n?"Pentru "+x.n:"").slice(0,200);GL=[];FSEG="gifts";tab("free");tap("giftfor")}

/* ---- banii pe abonamente și facturi (Control) ---- */
function moneyCard(){
 if(!can("monthly_total"))return"";
 const subs=S.items.filter(x=>!x.ex&&x.g=="sub"),bills=S.items.filter(x=>!x.ex&&x.g=="fac"&&+x.p>0);
 if(!subs.length&&!bills.length)return"";
 const ms=subs.reduce((s,x)=>s+mon(x),0),by={};bills.forEach(x=>by[x.t]=(by[x.t]||0)+(+x.p));
 const mb=Object.values(by).reduce((a,b)=>a+b,0),tot=ms+mb;
 const ch=subs.filter(x=>Array.isArray(x.ph)&&x.ph.length).map(x=>({x,l:x.ph[x.ph.length-1]})).filter(o=>okDate(o.l.d)&&(td()-pd(o.l.d))/DAY<=365&&+o.l.p!=+o.x.p);
 return `<div class="card"><strong>Pe lună, în total</strong><div class="ar"><span>Abonamente</span><span>${money(ms)} lei</span></div>${Object.keys(by).map(k=>`<div class="ar"><span>${esc(TYN[k])}</span><span>${money(by[k])} lei</span></div>`).join("")}<div class="ar" style="border-top:1px solid var(--ln);padding-top:8px"><b>Total</b><b>${money(tot)} lei</b></div><div class="mu sm" style="margin-top:6px">Cam ${money(tot*12)} lei pe an. Facturile intră cu suma aproximativă pe care ai scris-o.</div>${ch.length?`<div style="margin-top:10px"><b>Prețuri schimbate în ultimul an</b>${ch.map(o=>`<div class="ar"><span>${esc(o.x.n)}</span><span class="${+o.x.p>+o.l.p?"wn":"ok"}">${money(+o.l.p)} → ${money(+o.x.p)} lei</span></div>`).join("")}</div>`:""}</div>`}
function useCard(){
 if(!can("still_using"))return"";const lim=fmt(new Date(td().getTime()-90*DAY));
 S.items.forEach(x=>{if(x.g=="sub"&&!x.ex&&!okDate(x.uc||""))x.uc=fmt(td())});
 const x=S.items.find(x=>x.g=="sub"&&!x.ex&&!x.k&&x.uc<=lim);
 return x?`<div class="card"><strong>Mai folosești ${esc(x.n)}?</strong><div class="mu" style="margin-top:4px">Plătești ${money(mon(x))} lei pe lună. Te întrebăm o dată la 3 luni.</div><div class="acts"><button onclick="useAns('${x.id}',1)">Da, îl folosesc</button><button onclick="useAns('${x.id}',0)">Nu, vreau să-l anulez</button></div></div>`:""}
function useAns(id,y){const x=S.items.find(i=>i.id==id);if(!x)return;x.uc=fmt(td());if(!y)x.k=true;save();swap();toast(y?"Bine. Te întrebăm din nou peste 3 luni.":"L-am marcat „de anulat”.")}

/* ---- kilometri (Control) ---- */
const kmAvg=k=>{const r=(Array.isArray(k.kr)?k.kr:[]).filter(x=>okDate(x.d));if(r.length>=2){const a=r[0],b=r[r.length-1],d=(pd(b.d)-pd(a.d))/DAY;if(d>=7&&b.km>a.km)return (b.km-a.km)/d}return 33};
const kmReal=k=>{const r=(Array.isArray(k.kr)?k.kr:[]);return r.length>=2&&kmAvg(k)!==33};
function kmLine(x){
 if(x.g!="auto"||!can("car_km")||!(+x.kmi>0)||x.kml==null||x.kml==="")return"";
 const k=S.cars.find(z=>z.id==x.car);if(!k)return"";
 const next=+x.kml+(+x.kmi);
 if(!+k.km)return `<div class="mu sm" style="margin-top:4px">La ${money(next)} km. <button class="lkb" onclick="kmOpen('${k.id}')">Scrie kilometrii de acum</button></div>`;
 const rem=next-k.km;
 if(rem<=0)return `<div class="sm" style="margin-top:4px"><span class="st d">Ai trecut de ${money(next)} km</span></div>`;
 const days=Math.round(rem/kmAvg(k));
 return `<div class="sm" style="margin-top:4px"><span class="${days<=maxT()?"st wa":"mu"}">Mai ai ${money(rem)} km până la ${money(next)}, cam până pe ${esc(nice(plus(days)))}</span></div>`}
function kmOpen(id){
 const k=S.cars.find(z=>z.id==id);if(!k)return;
 if(gate("car_km","Kilometrii fac parte din Control."))return;
 openSheet(`<h2>Kilometri · ${esc(k.n)}</h2><div class="mu">Scrie cât arată acum bordul. Din citiri, aplicația estimează când ajungi la următorul schimb de ulei sau la revizie.</div><label for="km_v">Kilometri acum</label><input id="km_v" type="number" inputmode="numeric" min="0" max="2000000" value="${+k.km||""}"><div class="note">${kmReal(k)?"Media ta: cam "+money(kmAvg(k))+" km pe zi.":"Până ai două citiri la cel puțin o săptămână distanță, socotim 12.000 km pe an."}</div><div style="margin-top:14px"><button class="btn" onclick="kmSave('${k.id}')">Salvează</button><button class="btn alt" onclick="closeSheet()">Renunță</button></div>`,"km")}
function kmSave(id){
 const k=S.cars.find(z=>z.id==id),v=Math.round(+(($("km_v")||{}).value||NaN));if(!k)return;
 if(!(v>=0&&v<=2e6)){toast("Scrie un număr de kilometri");return}
 if(+k.km&&v<+k.km){toast("E mai puțin decât ultima citire ("+money(+k.km)+" km)");return}
 k.kr=(Array.isArray(k.kr)?k.kr:[]).filter(r=>r.d!=fmt(td())).concat({d:fmt(td()),km:v}).slice(-8);k.km=v;k.kd=fmt(td());
 save();closeSheet();render();toast("Kilometri salvați")}

/* ---- adăugare rapidă din text (Control); se citește pe telefon, nu se trimite nicăieri ---- */
const dia=s=>s.toLowerCase().replace(/[ăâ]/g,"a").replace(/î/g,"i").replace(/[șş]/g,"s").replace(/[țţ]/g,"t");
const QK=[[/\brca\b/,"auto","rca"],[/\bitp\b/,"auto","itp"],[/rovinie/,"auto","rov"],[/schimb(ul)? de ulei|\bulei\b/,"auto","ulei"],[/\breviz/,"auto","rev"],
 [/abonament (mobil|telefon)|\bvodafone\b|\btelekom\b/,"fac","tel"],[/\bcurent|\benel\b|electrica|\be\.?on\b|hidroelectrica|\bppc\b/,"fac","cur"],[/\bgaz(ul)?\b|\bengie\b/,"fac","gaz"],[/\bapa\b|apa nova/,"fac","apa"],[/internet|\bdigi\b|\brcs\b|\btv\b/,"fac","net"],[/\bchiri/,"fac","chi"],[/intretinere/,"fac","int"],
 [/netflix|spotify|\bhbo\b|\bmax\b|disney|youtube|icloud|google one|prime video|\bsala\b|abonament/,"sub","sub"],
 [/central/,"casa","cen"],[/instalati(a|e) de gaz/,"casa","igz"],[/\bpad\b/,"casa","pad"],[/cos(ul)? de fum/,"casa","cos"],[/aer conditionat/,"casa","acd"],
 [/\bimpozit/,"fis","imp"],[/declaratia unica/,"fis","du"],
 [/pasaport/,"doc","pas"],[/buletin|carte(a)? de identitate/,"doc","ci"],[/\bpermis/,"doc","pc"],[/\bcard(ul)?\b/,"doc","cb"],
 [/dentist|stomatolog/,"san","den"],[/\banalize/,"san","anl"],[/oftalmolog/,"san","ofl"],[/\bvaccin/,"san","vac"],[/deparazit/,"san","dep"],[/veterinar/,"san","vet"],
 [/onomastic/,"per","onom"],[/ziua (lui|ei)|\bziua\b|zi de nastere|\bla multi ani\b/,"per","zi"],[/aniversar/,"per","anv"],[/concert|spectacol|\bmeci\b|festival/,"per","ev"],[/programare|\bdoctor/,"per","prog"]];
function qaDate(s,take){
 const mk=(d,mo,y)=>{if(mo<0||mo>11||d<1||d>31)return null;let yy=y?+y:td().getFullYear();if(y&&String(y).length==2)yy=2000+(+y);if(!y&&mo==1&&d==29){while(new Date(yy,1,29).getMonth()!=1||new Date(yy,1,29)<td())yy++}const dt=new Date(yy,mo,d);if(dt.getMonth()!=mo)return null;return fmt(!y&&dt<td()?new Date(yy+1,mo,d):dt)};
 let m;
 if(take(/\bpoimaine\b/))return plus(2);
 if(take(/\bmaine\b/))return plus(1);
 if(take(/\bazi\b/))return plus(0);
 if(m=take(/\b(peste|in) (\d{1,3}) (zile|zi|saptamani|saptamana|luni|luna|ani|an)\b/)){const n=+m[2],u=m[3],d=td();if(u.startsWith("zi"))d.setDate(d.getDate()+n);else if(u.startsWith("sapt"))d.setDate(d.getDate()+7*n);else if(u.startsWith("lun"))return fmt(addM(d,n));else d.setFullYear(d.getFullYear()+n);return fmt(d)}
 if(m=take(/\b(\d{1,2}) ?(ianuarie|februarie|martie|aprilie|mai|iunie|iulie|august|septembrie|octombrie|noiembrie|decembrie|ian|feb|mar|apr|iun|iul|aug|sept|sep|oct|noi|nov|dec)\.?(?: (\d{4}))?\b/)){const k=m[2].slice(0,3)=="noi"?"nov":m[2].slice(0,3);return mk(+m[1],MON.indexOf(k),m[3])}
 if(m=take(/\b(\d{1,2})[./-](\d{1,2})(?:[./-](\d{4}|\d{2}))?\b/))return mk(+m[1],+m[2]-1,m[3]);
 return null}
function qaParse(raw){
 const o=String(raw||"").replace(/\s+/g," ").trim().slice(0,120),s=dia(o),mask=new Array(o.length).fill(false);
 const take=re=>{const m=re.exec(s);if(!m)return null;for(let i=m.index;i<m.index+m[0].length;i++)mask[i]=true;return m};
 let p=null;const pm=take(/(\d+(?:[.,]\d{1,2})?) ?(lei|ron)\b/);if(pm)p=parseFloat(pm[1].replace(",","."));
 const d=qaDate(s,take);
 let g="per",t="alt";
 for(const k of QK){const m=k[0].exec(s);if(m){g=k[1];t=k[2];if(g!="sub")for(let i=m.index;i<m.index+m[0].length;i++)mask[i]=true;break}}
 let n=o.split("").filter((c,i)=>!mask[i]).join("").replace(/\s+/g," ").replace(/^[\s,.;:–-]+|[\s,.;:–-]+$/g,"").replace(/^(pe|la|de|pentru|lui|ei)\s+/i,"").trim().slice(0,40);
 if(n)n=n.charAt(0).toUpperCase()+n.slice(1);
 return {g,t,n,d,p}}
function qaBox(){return can("quick_add")?`<div class="qa"><input id="qa_t" maxlength="120" placeholder="Ex.: RCA 12 martie 450 lei" aria-label="Adaugă rapid din text" onkeydown="if(event.key=='Enter')qaGo()"><button onclick="qaGo()">Completează</button></div>`:""}
function qaGo(){
 const e=$("qa_t"),v=e?e.value.trim():"";if(!v){toast("Scrie ce vrei să adaugi");return}
 if(gate("quick_add"))return;
 const r=qaParse(v),base=r.g=="sub"?{e:"📦",c:"m",rep:0}:r.g=="auto"?{rep:(AT.find(a=>a[0]==r.t)||[0,12])[1]}:r.g=="per"?{rep:(PT.find(a=>a[0]==r.t)||[0,0])[1]}:{rep:(XT[r.g].find(a=>a[0]==r.t)||[0,0,0])[2]};
 cur=Object.assign({note:""},base,{g:r.g,t:r.t,n:r.n,d:r.d||"",p:r.p==null?"":r.p,fromText:1});
 if(r.g=="per")cur.auto=cur.rep>0;
 if(e)e.value="";
 drawItem(false);if(!r.d)toast("N-am găsit data. Alege-o în formular.")}

/* ---- documente atașate (Control) ---- */
const ATT_T=["application/pdf","image/jpeg","image/png","image/webp"];
function attBox(c){
 if(fHid("attachments"))return"";
 let h=`<label>Documente atașate${ptag("attachments")}</label>`;
 if(!c.id)return h+`<div class="note">Poți atașa polița sau contractul după ce salvezi termenul.</div>`;
 if(!AS)return h+`<div class="note">Atașarea nu este disponibilă aici.</div>`;
 const l=(Array.isArray(c.att)?c.att:[]).filter(a=>/^[0-9a-f]{32}$/.test(a.id||""));
 h+=l.map(a=>`<div class="ar"><a href="/_blob/${a.id}" target="_blank" rel="noopener noreferrer">${a.t=="pdf"?"📄":"🖼️"} ${esc(a.n)}</a><button class="lkb dg" onclick="attDel('${a.id}')">Scoate</button></div>`).join("");
 if(can("attachments")&&l.length<3)h+=`<input id="att_f" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" onchange="attAdd(this.files[0])" style="margin-top:8px">`;
 return h+`<div class="note dg" id="att_m" role="alert"></div><div class="note">PDF sau poză, cel mult 3, sub 5 MB. Acoperă CNP-ul și alte date pe care nu vrei să le păstrezi.</div>`}
async function attAdd(f){
 const m=t=>{const e=$("att_m");if(e)e.textContent=t};
 if(!f||!AS||!can("attachments"))return;const x=S.items.find(i=>i.id==cur.id);if(!x)return;
 if((x.att||[]).length>=3){m("Poți atașa cel mult 3 documente.");return}
 if(!ATT_T.includes(f.type)){m("Alege un PDF sau o imagine.");return}
 if(f.size>5e6){m("Fișierul are peste 5 MB.");return}
 grab();m("");const st=$("att_m");if(st){st.classList.remove("dg");st.textContent="Se încarcă…"}
 try{const b=f.type=="application/pdf"?f:await shrink(f,1600,.85),r=await AS.upload(b);if(!/^[0-9a-f]{32}$/.test((r&&r.id)||""))throw new Error("id");
  x.att=(Array.isArray(x.att)?x.att:[]).concat({id:r.id,n:String(f.name||"document").slice(0,60),t:f.type=="application/pdf"?"pdf":"img"});cur.att=x.att;save();drawItem(true);toast("Document atașat")}
 catch(e){if(st)st.classList.add("dg");m("Nu am putut încărca fișierul.")}}
function attDel(id){const x=S.items.find(i=>i.id==cur.id);if(!x)return;grab();x.att=(x.att||[]).filter(a=>a.id!=id);cur.att=x.att;save();try{if(AS&&AS.delete)AS.delete(id).catch(()=>{})}catch(e){}drawItem(true)}

/* ---- calendar și widget (Control; simulate în prototip) ---- */
const CALP={google:"Google Calendar",apple:"Calendarul Apple",outlook:"Outlook"};
function phoneCard(){
 if(!can("calendar_sync")||!S.items.some(x=>!x.ex))return"";
 const c=S.cal&&CALP[S.cal.p];
 return `<div class="card xs"><strong>Calendar și widget</strong><div class="ph2"><div><b>Sincronizare cu calendarul</b><div class="mu">${c?"Conectat la "+c+" (demo). Termenele noi și cele schimbate ajung singure în calendar.":"Termenele apar singure în calendarul telefonului, fără fișiere."}</div><div class="acts">${c?`<button onclick="calOff()">Deconectează</button>`:`<button onclick="calOpen()">Conectează</button>`}</div></div><div><b>Widget pe ecranul telefonului</b><div class="mu">Următoarele termene, fără să deschizi aplicația.</div><div class="acts"><button onclick="wgShow()">Vezi cum arată</button></div></div></div></div>`}
function calOpen(){openSheet(`<h2>Sincronizare cu calendarul</h2><div class="mu">Alege calendarul. Termenele, cu memento-urile tale, apar acolo și se actualizează singure.</div><div class="prv">${Object.keys(CALP).map(p=>`<button class="btn alt" onclick="calSet('${p}')">${CALP[p]}</button>`).join("")}</div><button class="btn alt" onclick="closeSheet()">Renunță</button><div class="note">Prototip: conectarea este simulată și nu ajunge nimic în calendarul tău. Până la aplicația instalată, folosește „Descarcă pentru calendar”.</div>`,"cal")}
function calSet(p){if(!CALP[p]||!can("calendar_sync"))return;S.cal={p,at:Date.now()};save();closeSheet();render();toast("Conectat la "+CALP[p]+" (demo)")}
function calOff(){S.cal=null;save();render();toast("Calendarul a fost deconectat")}
function wgShow(){
 const a=S.items.filter(x=>!x.ex&&okDate(x.d)&&left(x.d)>=0).sort((x,y)=>left(x.d)-left(y.d)),nx=a[0];
 const sm=nx?`<div class="wg s"><span class="wl">LaTimp</span><b>${left(nx.d)}</b><span>${left(nx.d)==1?"zi":"zile"}</span><em>${esc(ttl(nx))}</em></div>`:`<div class="wg s"><span class="wl">LaTimp</span><em>Nimic programat</em></div>`;
 const md=`<div class="wg m"><span class="wl">LaTimp · Următoarele</span>${a.slice(0,3).map(x=>`<div class="ar"><span>${esc(ttl(x))}</span><span>${left(x.d)==0?"azi":left(x.d)==1?"mâine":"în "+left(x.d)+" zile"}</span></div>`).join("")||"<em>Nimic programat</em>"}</div>`;
 openSheet(`<h2>Widget</h2><div class="mu">Așa arată pe ecranul telefonului, cu termenele tale de acum.</div><div class="wgs">${sm}${md}</div><div class="sg"><b>Cum îl adaugi</b>După ce instalezi aplicația: ține apăsat pe ecranul principal, alege Widgeturi, apoi LaTimp.</div><button class="btn alt" onclick="closeSheet()">Închide</button>`,"wg")}
</script>
