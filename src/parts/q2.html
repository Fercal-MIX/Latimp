/* formatoarele de dată și sumă se creează o singură dată pe limbă (toLocaleString creează unul nou la fiecare apel și e lent) */

const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"")&&fmt(pd(s))==s;

/* stare salvată: completează câmpurile noi; vechiul prag de alertă devine primul memento */

try{const r=localStorage.getItem(K);

if(first)S.items=[{id:uid(),g:"sub",t:"sub",e:"🎬",n:"Netflix",p:40,c:"m",d:plus(5),ex:1},{id:uid(),g:"sub",t:"sub",e:"🎧",n:"Spotify",p:20,c:"m",d:plus(18),ex:1},{id:uid(),g:"sub",t:"sub",e:"🏋️",n:"Sală",p:150,c:"m",d:plus(11),ex:1}];

const use=async n=>{try{return window.claude?await window.claude.use(n):null}catch(e){return null}};
let DB=null,USR=null,UID=null,AI=null,AS=null,DL=null,DBOFF=false,CAN_ADMIN=false,PH=false,PHT=["image/jpeg","image/png","image/webp"];
let SY={ok:null,t:0,first:false},RP=[],STS=[],PEND=false,rdy;const RDY=new Promise(r=>rdy=r);
const DBU=()=>!!(DB&&UID&&!DBOFF);
const defCfg=()=>({news:null,ab:null,flags:{photo:true,fam:true,gifts:true,near:true,rep:true,sugg:true},f:{aff:"",aff_n:"",rca_n:"",rca_u:"",svc_n:"",svc_u:"",mail:"",priv:"",terms:""}});
let CFG=defCfg();
function writer(fn,wait){let t=0,busy=false,again=false;const run=async()=>{if(busy){again=true;return}busy=true;try{await fn()}catch(e){}busy=false;if(again){again=false;q()}};const q=()=>{clearTimeout(t);t=setTimeout(run,wait)};return q}

 if(!DBU()||!S.at||!S.acct)return;
 try{await DB.doc("data/users/"+UID+"/state").set({at:S.at,v:2,state:JSON.parse(JSON.stringify(S))});SY.ok=true;SY.t=Date.now()}
 catch(e){SY.ok=false;if(e&&(e.code=="invalid_argument"||e.code=="not_granted"))DBOFF=true}
 softMore()},900);
function onRemote(snap){
 SY.first=true;
 if(!snap.exists){if(S.at)push();rdy();return}
 const d=snap.data()||{},ra=+d.at||0;
 if(d.state&&ra>(+S.at||0)&&!S.acct&&d.state.acct){REM=d;softMore();rdy();return}
 if(d.state&&ra>(+S.at||0)){S=mig(d.state);S.at=ra;store();SY.ok=true;SY.t=Date.now();theme();uiApply();if(S.onb&&$("ov").classList.contains("on")&&$("sheet").dataset.k=="onb")closeSheet();famSetup();soft()}
 else if(!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites&&ra<(+S.at||0)&&S.acct)push();
 rdy()}
function onCfg(snap){const d=snap.exists?snap.data()||{}:{},b=defCfg();CFG={flags:Object.assign(b.flags,d.flags||{}),f:Object.assign(b.f,d.f||{}),news:d.news&&typeof d.news=="object"?d.news:null,ab:d.ab&&typeof d.ab=="object"?d.ab:null};soft()}

async function caps(){
 [DB,USR,AI,AS,DL]=await Promise.all(["db","user","sample","assets","downloads"].map(use));

  if(UID){try{DB.doc("data/users/"+UID+"/state").onSnapshot(onRemote,()=>{rdy()})}catch(e){rdy()}}else rdy();
  famSetup()}
 else rdy();
 soft()}

function touch(){if(!S.stats)return;const t=fmt(td());if(!S.st.first)S.st.first=t;if(!S.st.days[t]){S.st.days[t]=1;const k=Object.keys(S.st.days).sort();while(k.length>120)delete S.st.days[k.shift()];save()}}

 if(!DBU())return;const r=DB.doc("stats/"+UID);

 const s=S.st,o={first:s.first,last:fmt(td()),days:s.days,n:S.items.filter(x=>!x.ex).length,adds:s.adds||0,reads:s.reads||0,taps:s.taps||{},fam:!!S.fam,pro:!!S.pro&&!S.inv,inv:!!S.inv,ab:abOn()?abGrp():"",v:VER},j=JSON.stringify(o);

function toast(m){const t=$("toast");t.style.display="none";void t.offsetWidth;t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3200)}
function navSync(){document.body.dataset.tab=TAB;$("ind").style.transform="translateX("+ORDER.indexOf(TAB)*100+"%)";ORDER.forEach(k=>$("t-"+k).className=TAB==k?"on":"")}
function tab(t){
 if(t==TAB){if(t=="more"&&VIEW!="main"){VIEW="main";swap(-1)}return}
 const dir=ORDER.indexOf(t)>ORDER.indexOf(TAB)?1:-1;TAB=t;if(t!="more")VIEW="main";

 m.style.setProperty("--dx",dir*56+"px");m.classList.remove("go");m.classList.add("out");
 clearTimeout(tab.h);tab.h=setTimeout(()=>{m.classList.remove("out");render();scrollTo(0,0);enter(dir)},170)}

 const m=$("main"),c=$("cnt");
 if(c&&!reduce()){const v=+c.dataset.v,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);c.textContent=money(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
 const rf=m.querySelector(".rf");
 if(rf&&!reduce()){const o=rf.style.strokeDashoffset;rf.style.transition="none";rf.style.strokeDashoffset=rf.getAttribute("stroke-dasharray");void rf.getBoundingClientRect();rf.style.transition="";requestAnimationFrame(()=>requestAnimationFrame(()=>{rf.style.strokeDashoffset=o}))}

 const m=$("main");m.style.setProperty("--dx",dir*56+"px");

 m.classList.remove("go");void m.offsetWidth;m.classList.add("go");clearTimeout(enter.h);enter.h=setTimeout(()=>m.classList.remove("go"),1200);

 clearTimeout(swap.h);swap.h=setTimeout(()=>m.querySelectorAll(".pop").forEach(c=>c.classList.remove("pop")),1000);flair()}
const inField=()=>{const a=document.activeElement;return a&&$("main").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)};

(function(){const g=$("gr"),s=$("sheet");let y0=null,dy=0;
