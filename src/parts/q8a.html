{const di1=drawItem;drawItem=function(ed){di1(ed);const c=cur,sh=$("sheet");if(!sh||!c)return;

function paidSince(x){

 let tot=0,cur0=s;const steps=ph.concat({d:fmt(td()),p:+x.p});let prev=ph.length?+ph[0].p:+x.p;

 keep.filter(x=>!x.ex&&!x.mu&&x.g=="doc"&&x.t=="ci"&&x.old).forEach(x=>{const lim=new Date(2031,7,3);[180,30].forEach(k=>{const d=new Date(lim);d.setDate(d.getDate()-k);const t=at(fmt(d),0);if(t>now+60000&&t<=end)add.push({at:new Date(t).toISOString(),title:en?"Old ID card":"Buletin vechi",body:en?"Old ID cards without a chip stop being valid on 3 August 2031. Book an appointment for the electronic ID card.":"Buletinele vechi, fără cip, nu mai sunt valabile din 3 august 2031. Programează-te pentru cartea electronică.",tag:"lt-ci-"+x.id+"-"+k})})});
