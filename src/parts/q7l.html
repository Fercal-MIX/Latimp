<script>
/* ---------- Politica de confidențialitate și Termenii: aceleași texte în aplicație și pe paginile publice ---------- */
const LEGAL_DATE={ro:"27 noiembrie 2026",en:"27 November 2026"};
const LEGAL_FILL={ro:"[se completează]",en:"[to be completed]"};
/* {op} operatorul, {ad} adresa, {ml} e-mailul de contact; se completează din panou (app_config.app.legal) */
const LEGAL={
 priv:{
  ro:[
   ["Cine suntem","LaTimp este o aplicație pentru termene, plăți și timp liber. Operatorul datelor este {op}{ad}. Pentru orice întrebare despre datele tale scrie la {ml}."],
   ["Ce date folosim",["<b>Contul:</b> adresa de e-mail cu care te conectezi. Contul este opțional; fără cont, totul rămâne doar pe telefon.","<b>Agenda:</b> termenele, sumele, notele, persoanele și cadourile, listele, setările. Le scrii tu și le folosim doar ca să-ți arătăm agenda și să-ți trimitem memento-urile.","<b>Memento-urile pe telefon:</b> dacă le pornești, păstrăm adresa tehnică prin care telefonul primește notificări și programul memento-urilor (titlul termenului, data și ora).","<b>Familia:</b> termenele pe care alegi să le distribui sunt criptate pe telefon cu codul familiei înainte să plece. Pe server ajunge doar textul criptat și o amprentă a codului; nu le putem citi.","<b>Ideile, cadourile și citirea din poză:</b> când le ceri, detaliile scrise de tine (de exemplu cu cine ieși, bugetul, pentru cine e cadoul) sau poza documentului ajung prin serverul nostru la serviciul de inteligență artificială, care răspunde cu propuneri sau cu câmpurile citite. Nu trimitem restul agendei și nu păstrăm poza.","<b>Lângă mine:</b> doar când apeși „Folosește locația mea”, telefonul trimite o poziție aproximativă (rotunjită la aproximativ 1 km). Poziția exactă rămâne pe telefon, iar rezultatele se păstrează doar pe telefon. Când serverele OpenStreetMap sunt ocupate, căutarea trece prin serverul nostru, care păstrează rezultatele pentru acea zonă 7 zile, fără legătură cu tine.","<b>Calendarul care se actualizează singur:</b> dacă creezi linkul, păstrăm o copie a fișierului de calendar (titlurile, datele, notele și memento-urile termenelor), ca să o poată citi calendarul tău. Oricine are linkul o poate citi; îl poți opri oricând.","<b>Votul cu prietenii:</b> ideile puse la vot, numele pe care îl scrii când votezi și alegerea ta.","<b>Rapoartele:</b> textul pe care îl trimiți, captura de ecran dacă o atașezi și date tehnice (versiunea aplicației, mărimea ecranului, tipul de dispozitiv).","<b>Erorile:</b> mesajul tehnic al unei erori, versiunea și tipul de dispozitiv, fără conținutul agendei. Adresele de e-mail din mesaj se șterg înainte de trimitere.","<b>Statisticile de folosire:</b> doar dacă le pornești din Mai mult. Sunt cifre (de exemplu câte termene ai și în câte zile ai folosit aplicația), fără conținutul agendei.","<b>Date tehnice de conexiune:</b> adresa IP și tipul de browser ajung la furnizorii care livrează aplicația, pentru funcționare și securitate."]],
   ["Unde se păstrează",["Pe telefonul tău, în memoria aplicației.","Dacă ai cont: la Supabase, în centrul de date din Frankfurt (Germania, Uniunea Europeană): baza de date, fișierele atașate și funcțiile de pe server.","Codul aplicației este găzduit pe GitHub Pages."]],
   ["Cine le mai primește",["<b>Supabase</b> (bază de date, conturi, fișiere, funcții pe server), în UE.","<b>GitHub</b> (găzduirea aplicației și a fontului) și <b>jsDelivr</b> (biblioteca de conectare la server) primesc adresa IP când se încarcă aplicația.","<b>Google</b> transmite e-mailurile de conectare (cod sau link).","<b>Serviciul de notificări al telefonului</b> (Google pentru Android și Chrome, Apple pentru iPhone, Mozilla pentru Firefox) transmite memento-urile, criptate.","Unii dintre acești furnizori sunt în afara UE (Statele Unite). Transferul se face pe baza cadrului UE–SUA privind protecția datelor sau a clauzelor contractuale standard.","<b>Serviciul de inteligență artificială</b> (furnizor din Statele Unite) primește textul cererii sau poza doar când ceri idei, cadouri sau citirea unei poze. Prin contract nu le folosește pentru antrenare și le păstrează doar o perioadă limitată.","<b>OpenStreetMap</b> (serverele Overpass, din Germania) primește poziția aproximativă și adresa IP când cauți locuri lângă tine. Datele despre locuri sunt © colaboratorii OpenStreetMap.","<b>Calendarul tău</b> (de exemplu Google Calendar, calendarul Apple sau Outlook) citește fișierul de calendar de la serverul nostru, dacă adaugi linkul.","Nu vindem datele și nu le folosim pentru reclame."]],
   ["De ce le folosim (temeiul legal)",["Ca să funcționeze serviciul pe care l-ai cerut: agenda, contul, memento-urile, familia, votul, ideile și locurile din apropiere, calendarul abonat (executarea contractului).","Cu acordul tău: statisticile de folosire și funcțiile cu inteligență artificială (ideile, cadourile, citirea pozelor). Îl poți retrage oricând din Mai mult.","Pentru securitate, prevenirea abuzurilor și repararea erorilor (interes legitim)."]],
   ["Cât timp le păstrăm",["Datele din cont, cât timp ai cont. „Șterge contul” din Mai mult șterge de pe server contul, agenda, memento-urile, abonările la notificări, familia, voturile și fișierele tale.","Memento-urile trimise se șterg după cel mult 30 de zile.","Copia pentru calendarul abonat, până oprești linkul sau ștergi contul.","Statisticile se șterg când le oprești.","Rapoartele și erorile se păstrează cât e nevoie ca să rezolvăm problema.","„Șterge toate datele” șterge ce e pe telefon."]],
   ["Drepturile tale",["Acces, rectificare, ștergere, restricționare, opoziție și portabilitate. Pentru portabilitate folosește „Copie într-un fișier” din Mai mult.","Retragerea acordului oricând, fără să afecteze ce s-a făcut înainte.","Pentru orice cerere scrie la {ml}. Răspundem în cel mult o lună.","Poți depune plângere la Autoritatea Națională de Supraveghere a Prelucrării Datelor cu Caracter Personal (ANSPDCP), www.dataprotection.ro."]],
   ["Stocare pe dispozitiv",["Aplicația păstrează datele în memoria browserului sau a telefonului (de exemplu agenda și sesiunea de conectare). Nu folosim cookie-uri de reclamă sau de urmărire."]],
   ["Securitate",["Legătura cu serverul este criptată. Fiecare cont vede doar datele lui. Familia este criptată pe telefon. PIN-ul aplicației rămâne doar pe telefon."]],
   ["Copii",["LaTimp nu este destinată copiilor sub 16 ani."]],
   ["Modificări",["Dacă schimbăm această politică, anunțăm în aplicație. Ultima actualizare: {date}."]]
  ],
  en:[
   ["Who we are","LaTimp is an app for due dates, payments and free time. The data controller is {op}{ad}. For any question about your data, write to {ml}."],
   ["What data we use",["<b>Account:</b> the email address you sign in with. The account is optional; without it everything stays on your phone.","<b>Agenda:</b> due dates, amounts, notes, people and gifts, lists, settings. You enter them and we use them only to show your agenda and send your reminders.","<b>Phone reminders:</b> if you turn them on, we keep the technical address your phone uses to receive notifications and your reminder schedule (the item's title, date and time).","<b>Family:</b> the dates you choose to share are encrypted on your phone with the family code before they leave it. The server only receives encrypted text and a fingerprint of the code; we cannot read them.","<b>Ideas, gifts and photo reading:</b> when you ask for them, the details you type (for example who you go out with, the budget, who the gift is for) or the photo of the document go through our server to the artificial intelligence service, which replies with suggestions or the fields it read. We don't send the rest of your agenda and don't keep the photo.","<b>Near me:</b> only when you tap “Use my location”, the phone sends an approximate position (rounded to about 1 km). The exact position stays on the phone, and the results are kept only on the phone. When the OpenStreetMap servers are busy, the search goes through our server, which keeps the results for that area for 7 days, not linked to you.","<b>The self-updating calendar:</b> if you create the link, we keep a copy of the calendar file (titles, dates, notes and reminders of your items) so your calendar can read it. Anyone with the link can read it; you can turn it off at any time.","<b>Votes with friends:</b> the ideas put to the vote, the name you type when voting and your choice.","<b>Reports:</b> the text you send, the screenshot if you attach one, and technical details (app version, screen size, device type).","<b>Errors:</b> the technical error message, the version and device type, without your agenda. Email addresses in the message are removed before sending.","<b>Usage statistics:</b> only if you turn them on in More. They are numbers (for example how many dates you have and on how many days you used the app), without your agenda.","<b>Technical connection data:</b> your IP address and browser type reach the providers that deliver the app, for operation and security."]],
   ["Where it is kept",["On your phone, in the app's storage.","If you have an account: at Supabase, in the Frankfurt data centre (Germany, European Union): the database, attached files and server functions.","The app's code is hosted on GitHub Pages."]],
   ["Who else receives it",["<b>Supabase</b> (database, accounts, files, server functions), in the EU.","<b>GitHub</b> (hosting the app and its font) and <b>jsDelivr</b> (the server connection library) receive your IP address when the app loads.","<b>Google</b> delivers the sign-in emails (code or link).","<b>Your phone's notification service</b> (Google for Android and Chrome, Apple for iPhone, Mozilla for Firefox) delivers the reminders, encrypted.","Some of these providers are outside the EU (United States). Transfers rely on the EU–US Data Privacy Framework or standard contractual clauses.","<b>The artificial intelligence service</b> (a provider in the United States) receives the request text or the photo only when you ask for ideas, gifts or photo reading. By contract it does not use them for training and keeps them only for a limited time.","<b>OpenStreetMap</b> (the Overpass servers, in Germany) receives the approximate position and your IP address when you look for places near you. Place data is © OpenStreetMap contributors.","<b>Your calendar</b> (for example Google Calendar, Apple Calendar or Outlook) reads the calendar file from our server, if you add the link.","We don't sell data and don't use it for advertising."]],
   ["Why we use it (legal basis)",["To provide the service you asked for: the agenda, the account, reminders, family, votes, ideas and nearby places, the subscribed calendar (performance of the contract).","With your consent: usage statistics and the artificial intelligence features (ideas, gifts, photo reading). You can withdraw it at any time in More.","For security, abuse prevention and fixing errors (legitimate interest)."]],
   ["How long we keep it",["Account data, as long as you have an account. “Delete account” in More removes from the server your account, agenda, reminders, notification subscriptions, family, votes and files.","Sent reminders are deleted after at most 30 days.","The copy for the subscribed calendar, until you turn off the link or delete your account.","Statistics are deleted when you turn them off.","Reports and errors are kept as long as needed to fix the problem.","“Delete all data” removes what is on the phone."]],
   ["Your rights",["Access, rectification, erasure, restriction, objection and portability. For portability use “Backup to a file” in More.","Withdrawing consent at any time, without affecting what was done before.","For any request write to {ml}. We answer within one month.","You can complain to the Romanian data protection authority (ANSPDCP), www.dataprotection.ro."]],
   ["Storage on your device",["The app keeps data in the browser's or phone's storage (for example your agenda and sign-in session). We don't use advertising or tracking cookies."]],
   ["Security",["The connection to the server is encrypted. Each account sees only its own data. Family data is encrypted on the phone. The app PIN stays only on your phone."]],
   ["Children",["LaTimp is not meant for children under 16."]],
   ["Changes",["If we change this policy, we will announce it in the app. Last updated: {date}."]]
  ]},
 terms:{
  ro:[
   ["Serviciul","LaTimp te ajută să ții evidența termenelor și a plăților, îți trimite memento-uri și îți dă idei pentru timpul liber. Aplicația este oferită de {op}{ad}. Folosind aplicația, ești de acord cu acești termeni."],
   ["Versiunea de test",["Aplicația este în perioada de test. Unele funcții se pot schimba, pot lipsi temporar sau pot avea erori. În această perioadă, toate funcțiile sunt gratuite."]],
   ["Contul",["Contul este opțional și se creează cu adresa de e-mail. Ai grijă ca doar tu să ai acces la e-mailul cu care te conectezi.","Poți șterge contul oricând din Mai mult."]],
   ["Memento-urile",["Memento-urile te ajută, dar nu sunt garantate: depind de telefon, de setările lui, de conexiunea la internet și de serviciile de notificări. Respectarea termenelor (plăți, documente, taxe) rămâne în grija ta.","Informațiile din aplicație (de exemplu zilele libere legale sau sugestiile) au caracter informativ. Verifică datele oficiale când e important.","Ideile, cadourile și câmpurile citite din poză sunt propuneri generate automat și pot conține greșeli: verifică-le înainte să te bazezi pe ele. Locurile din apropiere vin din OpenStreetMap și pot fi incomplete sau depășite (programul, accesul)."]],
   ["Planuri și plăți",["Unele funcții pot deveni parte din planul plătit Control (abonament) sau pot folosi Scântei (pachete cu plată unică). Prețurile, perioada de probă și modul de anulare vor fi afișate clar înainte de orice plată.","Abonamentele cumpărate prin magazinele de aplicații se anulează din contul magazinului; rambursările urmează regulile magazinului și legea.","Ca utilizator consumator, ai dreptul de retragere de 14 zile pentru serviciile digitale, cu excepțiile prevăzute de lege atunci când ai cerut începerea imediată a serviciului."]],
   ["Coduri",["Codurile de invitație și de recomandare dau acces temporar și pot fi retrase dacă sunt folosite abuziv sau după data lor de expirare."]],
   ["Folosirea corectă",["Nu folosi aplicația pentru a încălca legea sau drepturile altora, nu încerca să accesezi datele altor utilizatori și nu supraîncărca serviciul.","Nu adăuga date sensibile ale altor persoane fără acordul lor. În familie și la vot, distribui doar ce vrei să vadă ceilalți."]],
   ["Conținutul tău",["Ce scrii în aplicație rămâne al tău. Ne dai doar permisiunea să-l păstrăm și să-l prelucrăm ca să funcționeze serviciul, așa cum scrie în Politica de confidențialitate."]],
   ["Disponibilitate și răspundere",["Facem tot ce putem ca serviciul să funcționeze, dar nu putem garanta că va fi mereu disponibil sau fără erori.","Nu răspundem pentru pierderi cauzate de un memento neprimit sau de o informație orientativă, în măsura permisă de lege. Drepturile tale de consumator prevăzute de lege nu sunt limitate."]],
   ["Suspendare și încheiere",["Poți înceta oricând să folosești aplicația și poți șterge contul. Putem suspenda un cont folosit abuziv, cu informarea ta când e posibil."]],
   ["Modificări",["Schimbările importante ale acestor termeni le anunțăm în aplicație înainte să se aplice. Ultima actualizare: {date}."]],
   ["Legea și reclamațiile",["Se aplică legea română. Pentru reclamații scrie-ne întâi la {ml}. Ca și consumator, te poți adresa și Autorității Naționale pentru Protecția Consumatorilor (ANPC), www.anpc.ro, sau platformei europene de soluționare online a litigiilor."]]
  ],
  en:[
   ["The service","LaTimp helps you keep track of due dates and payments, sends you reminders and gives ideas for free time. The app is provided by {op}{ad}. By using the app, you agree to these terms."],
   ["Test version",["The app is in its test period. Some features may change, be temporarily missing or have errors. During this period, all features are free."]],
   ["Account",["The account is optional and is created with your email address. Make sure only you can access the email you sign in with.","You can delete the account at any time in More."]],
   ["Reminders",["Reminders help you, but they are not guaranteed: they depend on your phone, its settings, your internet connection and notification services. Meeting deadlines (payments, documents, taxes) remains your responsibility.","Information in the app (for example public holidays or suggestions) is for guidance. Check official sources when it matters.","Ideas, gifts and fields read from a photo are automatically generated suggestions and may contain mistakes: check them before relying on them. Nearby places come from OpenStreetMap and may be incomplete or out of date (opening hours, access)."]],
   ["Plans and payments",["Some features may become part of the paid Control plan (subscription) or use Sparks (one-time packs). Prices, the trial period and how to cancel will be shown clearly before any payment.","Subscriptions bought through app stores are cancelled from your store account; refunds follow the store's rules and the law.","As a consumer, you have a 14-day right of withdrawal for digital services, with the exceptions set by law when you asked for the service to start immediately."]],
   ["Codes",["Invitation and referral codes give temporary access and can be withdrawn if misused or after their expiry date."]],
   ["Fair use",["Don't use the app to break the law or the rights of others, don't try to access other users' data and don't overload the service.","Don't add other people's sensitive data without their consent. In family and votes, share only what you want others to see."]],
   ["Your content",["What you write in the app stays yours. You only allow us to keep and process it so the service works, as described in the Privacy policy."]],
   ["Availability and liability",["We do our best to keep the service working, but we cannot guarantee it will always be available or error-free.","We are not liable for losses caused by a reminder that was not received or by guidance information, to the extent permitted by law. Your statutory consumer rights are not limited."]],
   ["Suspension and termination",["You can stop using the app and delete your account at any time. We may suspend an account used abusively, informing you when possible."]],
   ["Changes",["We will announce important changes to these terms in the app before they apply. Last updated: {date}."]],
   ["Law and complaints",["Romanian law applies. For complaints, write to us first at {ml}. As a consumer, you can also contact the Romanian consumer protection authority (ANPC), www.anpc.ro, or the European online dispute resolution platform."]]
  ]}};
function legalFill(s,lg,v){return s.replace(/\{op\}/g,v.op).replace(/\{ad\}/g,v.ad).replace(/\{ml\}/g,v.ml).replace(/\{date\}/g,LEGAL_DATE[lg])}
/* HTML pentru o secțiune; folosit și la construirea paginilor publice */
function legalHtml(k,lg,v,tag){tag=tag||"h3";return LEGAL[k][lg].map(([h,b])=>`<${tag}>${h}</${tag}>`+(Array.isArray(b)?(b.length>1?`<ul>${b.map(x=>`<li>${legalFill(x,lg,v)}</li>`).join("")}</ul>`:`<p>${legalFill(b[0],lg,v)}</p>`):`<p>${legalFill(b,lg,v)}</p>`)).join("")}
function legalVals(lg){const L=(typeof CFGW!="undefined"&&CFGW&&CFGW.legal)||{},f=(typeof CFG!="undefined"&&CFG.f)||{},F=LEGAL_FILL[lg],t=x=>esc(String(x||"").trim().slice(0,200));
 return{op:(o=>lg=="en"?o.replace("(persoană fizică)","(private individual)"):o)(t(L.operator||f.co_n))||(lg=="en"?"the operator of the LaTimp app":"operatorul aplicației LaTimp")+" "+F,ad:(a=>a?(lg=="en"?", registered at ":", cu sediul la ")+a:"")(t(L.address||f.co_a)),ml:t(L.email||f.mail)||F}}
legalTxt=function(k){const lg=S.lang=="en"?"en":"ro";return legalHtml(k=="priv"?"priv":"terms",lg,legalVals(lg))};
legal=function(k){
 const en=S.lang=="en",t=k=="priv"?(en?"Privacy policy":"Politica de confidențialitate"):(en?"Terms and conditions":"Termeni și condiții");
 const pg=window.LT_WEB?(k=="priv"?(en?"privacy.html":"confidentialitate.html"):(en?"terms.html":"termeni.html")):"";
 openSheet(`<div data-nt><h2>${t}</h2><div class="lgl">${legalTxt(k)}</div>${pg?`<a class="btn alt" href="${pg}" target="_blank" rel="noopener">${en?"Open as a web page":"Deschide ca pagină web"}</a>`:""}<button class="btn alt" onclick="closeSheet()">${en?"Close":"Închide"}</button></div>`,"legal")};
</script>
