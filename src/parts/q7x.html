<script>
/* ---------- Doar în versiunea web: rezumatul săptămânii pe telefon, documente atașate în cont, prețuri și texte din panou, conectare cu Google ---------- */
/* rezumatul săptămânii: luni, la ora memento-urilor, ce ai de rezolvat în acea săptămână */
function wkPlan(){
 if(!can("weekly_summary")||!S.nt||!S.nt.wk)return[];
 const out=[],now=Date.now(),en=S.lang=="en",pz=typeof pauseOn=="function"&&pauseOn()?+pd(S.np)+DAY:0,[h,m]=ntH().split(":").map(Number);
 const d0=new Date();d0.setHours(h,m,0,0);d0.setDate(d0.getDate()+((8-d0.getDay())%7));
 for(let w=0;w<9;w++){
  const at=new Date(d0);at.setDate(d0.getDate()+7*w);const t=+at;if(t<=now+60000||t>now+60*DAY||t<pz)continue;
  const st=new Date(at);st.setHours(0,0,0,0);const en0=+st+7*DAY;
  const l=S.items.filter(x=>!x.ex&&okDate(x.d)&&+pd(x.d)>=+st&&+pd(x.d)<en0).sort((a,b)=>+pd(a.d)-+pd(b.d));
  if(!l.length)continue;
  const n=l.slice(0,2).map(x=>String(ttl(x)||"").slice(0,40)).join(", "),r=l.length-2;
  const body=en?(l.length==1?"1 due date this week: ":l.length+" due dates this week: ")+n+(r>0?" and "+r+" more.":"."):(l.length==1?"Un termen săptămâna asta: ":l.length+" termene săptămâna asta: ")+n+(r>0?" și încă "+r+".":".");
  out.push({at:at.toISOString(),title:en?"Your week":"Săptămâna ta",body:body.slice(0,300),tag:"lt-wk-"+t})}
 return out}
if(WEB){const rp0=remPlan;remPlan=function(){return rp0().concat(wkPlan()).sort((a,b)=>a.at<b.at?-1:1).slice(0,200)}}

/* documente atașate: în contul tău (Supabase Storage, dosar privat), nu pe server public */
const ATT_B="attachments";
const attHex=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");
function attStore(){
 if(!WEB||!SB||!SBU)return null;
 return{
  upload:async b=>{const id=attHex(),{error}=await SB.storage.from(ATT_B).upload(SBU.id+"/"+id,b,{contentType:b.type||"application/octet-stream",upsert:false});if(error)throw error;return{id}},
  delete:async id=>{const{error}=await SB.storage.from(ATT_B).remove([SBU.id+"/"+id]);if(error)throw error}}}
async function attOpen(id){
 if(!/^[0-9a-f]{32}$/.test(id))return;
 if(!SB||!SBU){toast("Conectează-te la cont ca să deschizi documentul.");return}
 const w=window.open("","_blank");
 try{const{data,error}=await SB.storage.from(ATT_B).createSignedUrl(SBU.id+"/"+id,120);if(error||!data||!data.signedUrl)throw error;
  if(w&&!w.closed)w.location.href=data.signedUrl;else location.href=data.signedUrl}
 catch(e){if(w&&!w.closed)w.close();toast(navigator.onLine===false?"Documentul se deschide doar cu internet.":"Nu am putut deschide documentul.")}}
if(WEB){
 const ab0=attBox;attBox=function(c){
  AS=attStore();
  if(!AS&&c&&c.id){const n=(Array.isArray(c.att)?c.att.length:0);
   return `<label>Documente atașate${ptag("attachments")}</label><div class="note">${n?"Documentele atașate le vezi după ce te conectezi la cont.":"Documentele se păstrează în contul tău, ca să le ai pe orice telefon."}</div><button class="btn alt" style="margin-top:8px" onclick="closeSheet();acctOpen('Conectează-te ca să atașezi documente. Le găsești apoi pe orice telefon.')">Conectează-te</button>`}
  return ab0(c).replace(/<a href="\/_blob\/([0-9a-f]{32})"[^>]*>/g,(_,id)=>`<a href="#" onclick="attOpen('${id}');return false">`)};
 const lim=()=>{const v=CFGW&&CFGW.plans&&CFGW.plans.limits&&+CFGW.plans.limits.attachments_max;return v>0&&v<=20?Math.round(v):3};
 const aa0=attAdd;attAdd=async function(f){
  AS=attStore();const x=S.items.find(i=>i.id==cur.id),n=x&&Array.isArray(x.att)?x.att.length:0,L=lim();
  if(f&&n>=L){const e=$("att_m");if(e)e.textContent=L==1?"Poți atașa un singur document.":"Poți atașa cel mult "+L+" documente.";return}
  return aa0(f)};
 const ad0=attDel;attDel=function(id){AS=attStore();ad0(id)};
}

/* prețurile din panou: prețul obișnuit, reducerea și varianta din testul A/B (are prioritate) */
function webPrices(){
 const p=CFGW&&CFGW.prices||{},v=ACC&&ACC.ab&&ACC.ab.variant||{},n=x=>{const r=parseFloat(String(x==null?"":x).replace(",","."));return isFinite(r)&&r>0&&r<10000?r:0};
 let y=n(v.year)||n(p.year),m=n(v.month)||n(p.month);
 const pr=promoNow();if(pr){if(y)y=Math.round(y*(100-pr.pct))/100;if(m)m=Math.round(m*(100-pr.pct))/100}
 return{y,m,txt:String(v.text||"").slice(0,120)}}
function promoNow(){const p=CFGW&&CFGW.prices&&CFGW.prices.promo;if(!p||typeof p!="object")return null;const pct=Math.round(+p.pct);if(!(pct>0&&pct<100))return null;if(p.until&&String(p.until).slice(0,10)<fmt(td()))return null;return{pct,until:p.until?String(p.until).slice(0,10):"",label:String(p.label||"").slice(0,80)}}
if(WEB){
 const pr0=price;price=function(){const w=webPrices(),d=pr0();return[w.y||d[0],w.m||d[1]]};
}

/* textele din panou (Conținut → Texte): gol = textul implicit */
let TXW=lsGet("latimp.txt");
async function txtLoad(){if(!SB)return;try{const{data}=await SB.from("app_config").select("value").eq("key","texts").maybeSingle();if(data&&data.value&&typeof data.value=="object"){TXW=data.value;lsSet("latimp.txt",TXW)}}catch(e){}}
function TXT(k,d){const l=S.lang=="en"?"en":"ro",o=TXW&&TXW[l],v=o&&typeof o[k]=="string"?o[k].trim():"";return v?v.slice(0,200):d}
function txtSheet(){
 const sh=$("sheet");if(!sh)return;const h=sh.querySelector("h2");if(!h)return;
 const set=(el,k)=>{const v=TXT(k,"");if(el&&v){const tag=el.querySelector(".tag");el.textContent=v;if(tag)el.append(" ",tag)}};
 if(/^Control/.test(h.textContent)&&sh.querySelector(".cmp")){set(h,"paywall_title");const s=h.nextElementSibling;if(s&&s.classList.contains("mu"))set(s,"paywall_sub");
  const w=webPrices();if(w.txt&&!sh.querySelector(".abt")){const d=document.createElement("div");d.className="note abt";d.textContent=w.txt;h.after(d)}
  const pr=promoNow();if(pr&&!sh.querySelector(".prm")){const d=document.createElement("div");d.className="note prm";d.textContent=TXT("promo_banner",pr.label||("Reducere de "+pr.pct+"%"+(pr.until?" până pe "+nice(pr.until):"")));h.after(d)}}
 if(/^Scântei/.test(h.textContent))set(h,"sparks_title")}
if(WEB){
 const op1=openPlan;openPlan=function(k){op1(k);try{txtSheet()}catch(e){}};
 const cl1=cfgLoad;cfgLoad=async function(){await cl1();await txtLoad()};
}

/* conectare cu Google: apare doar după ce e pornită în panou (app.auth.google) și configurată în Supabase */
const gOn=()=>!!(WEB&&SB&&CFGW&&CFGW.auth&&CFGW.auth.google===true);
const GICON=`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px;margin-right:8px"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.8h3.6c2.1-1.9 3.3-4.8 3.3-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.6l3.2-3.2A11 11 0 0 0 2.1 7l3.7 2.9C6.7 7.3 9.1 5.4 12 5.4z"/></svg>`;
async function sbGoogle(){
 if(!SB)return;const b=$("ac_g");if(b){b.disabled=true}
 try{const{error}=await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:LT_SB.home||(location.origin+location.pathname)}});if(error)throw error}
 catch(e){if(b)b.disabled=false;acctErr("Conectarea cu Google nu a mers. Folosește adresa de e-mail.")}}
if(WEB){
 const da1=drawAcct;drawAcct=function(){da1();
  if(!gOn()||S.acct||AC.m=="code")return;const lb=document.querySelector('#sheet label[for="ac_e"]');if(!lb||$("ac_g"))return;
  lb.insertAdjacentHTML("beforebegin",`<button class="btn alt" id="ac_g" style="margin-top:14px" onclick="sbGoogle()">${GICON}Continuă cu Google</button><div class="note" style="text-align:center">sau cu adresa de e-mail</div>`)};
}
</script>
