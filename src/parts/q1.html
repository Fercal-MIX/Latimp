#spl.q .spw{animation:spq .35s ease both}
@keyframes spd{to{stroke-dashoffset:0}}
@keyframes spp{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes spq{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#spl .d{stroke-dasharray:none;stroke-dashoffset:0}#spl .pp{transform:none}}

/* ---- etapa 1: cont, notificări, afișare, blocare ---- */
.nr{display:flex;align-items:center;gap:10px}.nr input{max-width:120px}
.stp{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:99px;padding:3px}
.stp button{width:38px;height:38px;border-radius:99px;font-size:20px;font-weight:700;color:var(--tx)}
.stp button:disabled{opacity:.35}
.stp b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;margin:-8px -8px 0 0;border-radius:99px;color:var(--mu);font-size:15px}
.prv{margin-top:14px}.prv .btn.alt{background:var(--card);box-shadow:0 0 0 1px var(--ln);display:flex;align-items:center;justify-content:center;gap:10px}
.prv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note:empty{display:none}
.wk{border-left:4px solid var(--a1)}
.lkb{font:inherit;font-size:14px;font-weight:700;color:var(--ac);padding:2px 0}
#pb{position:fixed;left:0;right:0;top:0;z-index:160;display:flex;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;transform:translateY(-120%);transition:transform .45s var(--sp)}
#pb.on{transform:none}
#pb>button{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;max-width:440px;background:var(--card);color:var(--tx);border-radius:20px;padding:12px 14px;box-shadow:0 0 0 1px var(--ln),0 18px 40px -14px #0006}
#pb .pi{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--a1);color:#fff;display:grid;place-items:center}
#pb .pi svg{width:26px;height:26px}
#pb .pt{min-width:0;display:flex;flex-direction:column;font-size:14px;line-height:1.35}
#pb .pa{font-size:12px;color:var(--mu)}
#lk{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
html.lkd body{overflow:hidden}
.lkw{width:100%;max-width:320px;text-align:center}
.lkl{width:56px;height:56px;color:var(--a1);margin:0 auto 10px;display:block}
.lkw h2{margin:0;font-size:22px}
.pind{display:flex;gap:16px;justify-content:center;margin:20px 0 6px}
.pind i{width:16px;height:16px;border-radius:99px;box-shadow:inset 0 0 0 2px var(--tx);transition:background .15s}
.pind i.on{background:var(--tx)}
.pind.no{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lkm{min-height:22px;font-size:14px;font-weight:600;color:var(--bd);margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
.pad button{width:72px;height:72px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-size:26px;font-weight:600;color:var(--tx)}
.pad button.sm{background:none;box-shadow:none;font-size:14px;font-weight:700;color:var(--ac)}
.pad button:active{background:var(--ln)}
.lkf{margin-top:18px;font-weight:700;color:var(--ac);padding:10px}
.lkw .btn{margin-top:10px}
.lkw input{margin-top:8px}
html[data-fs=l] body{zoom:1.12}
html[data-fs=xl] body{zoom:1.22}
html[data-simple]{--mu:#4a4f40}
@media (prefers-color-scheme:dark){html[data-simple]:not([data-theme=light]){--mu:#c9ccbe}}
html[data-simple][data-theme=dark]{--mu:#c9ccbe}
html[data-simple] .li .sg,html[data-simple] .xs{display:none}
html[data-motion=off] *,html[data-motion=off] *:before,html[data-motion=off] *:after{animation:none!important;transition:none!important}

/* ---- etapa 2 ---- */
.qa{display:flex;gap:8px;margin-top:10px}.qa input{flex:1;min-width:0}
.qa button{flex:0 0 auto;border-radius:var(--r3);padding:0 14px;min-height:48px;font-weight:700;background:var(--card);box-shadow:0 0 0 1px var(--ln);color:var(--tx)}
.gt.car>span:last-child{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:flex-end}
.ph2>div{margin-top:12px}.ph2>div+div{border-top:1px solid var(--ln);padding-top:12px}
.wgs{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0;padding:16px;border-radius:var(--r2);background:linear-gradient(135deg,var(--ha1),var(--ha2))}
.wg{background:var(--card);color:var(--tx);border-radius:22px;padding:12px 14px;box-shadow:0 10px 24px -12px #0007;display:flex;flex-direction:column;min-width:0}
.wg.s{width:132px;height:132px}.wg.m{flex:1 1 220px;min-height:132px}
.wg .wl{font-size:11px;font-weight:700;color:var(--a1)}
.wg.s b{font-size:40px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.wg em{font-style:normal;font-size:13px;font-weight:600;margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg .ar{font-size:13px;margin-top:6px}.wg .ar span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- etapa 3 ---- */
.fyb{border-top:1px solid var(--ln);margin-top:12px;padding-top:12px}
.ch{border-left:4px solid var(--a2)}
.tli label{display:flex;gap:10px;align-items:center;min-width:0;font-weight:500}
.tli label span{overflow-wrap:anywhere}
.tli .x{margin:0}

.nw{border-left:4px solid var(--a1)}

/* ---- etapa 5 ---- */
.pg{padding:10px 0;border-top:1px solid var(--ln)}.pg:first-of-type{border-top:0}
.seg.vw{display:inline-flex}
.cal{background:var(--card);box-shadow:0 0 0 1px var(--ln);border-radius:var(--r2);padding:12px;margin-top:12px}
.cah{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cah button{width:40px;height:40px;border-radius:99px;font-size:20px;color:var(--ac)}
.cag{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cdw{font-size:12px;font-weight:700;color:var(--mu);padding:4px 0}
.cday{position:relative;aspect-ratio:1;max-height:48px;border-radius:12px;font-size:15px;font-variant-numeric:tabular-nums;color:var(--tx);display:flex;align-items:center;justify-content:center}
.cday.t{box-shadow:inset 0 0 0 2px var(--a1);font-weight:800}
.cday.h{color:var(--a2);font-weight:800}
.cday.on{background:var(--gr);color:#fff}
.cd{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:99px;background:var(--mu)}
.cd.wa{background:var(--wn)}.cd.d{background:var(--bd)}
.cday.on .cd{background:#fff}

/* ---- etapa 6 ---- */
.srch{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;margin:4px 0 10px;padding:0 14px;border-radius:var(--r3);background:var(--card);box-shadow:0 0 0 1px var(--ln);color:var(--mu);font-size:15px}
.srch svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.srr .gt{margin:0;padding:12px 16px 4px}
.yrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.yr{background:var(--bg);border-radius:var(--r3);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.yr b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.yr span{font-size:13px;color:var(--mu)}

.pfl .ar{align-items:center}.pfl .ar>span:first-child{min-width:0}.pfl .ar .acts{flex-wrap:nowrap;flex:0 0 auto}

.lgl h3{font-size:15px;margin:16px 0 4px}.lgl p{margin:0;font-size:14px;line-height:1.55}

/* ---- rafinare ---- */
.tb{display:flex;gap:8px;align-items:center;margin:4px 0 10px}.tb .srch{flex:1;margin:0;min-width:0}.tb .seg.vw{margin:0}
.rowc{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 16px}
.bwl{margin-top:10px;padding-top:10px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu)}
.ctl{border-left:4px solid var(--a1)}

/* ---- rafinare 5–12 ---- */
.sw::before{content:"";position:absolute;inset:-8px -4px}
.lkb{padding:10px 4px;margin:-8px -4px}
.sgd{margin-top:10px}.sgd summary{font-size:14px;font-weight:700;color:var(--ac);cursor:pointer;padding:8px 0;list-style:none}
.sgd summary::-webkit-details-marker{display:none}.sgd summary::after{content:" ›"}.sgd[open] summary::after{content:" ‹"}
.sgd .sg{margin-top:4px}

/* ---- culori după plan: Grafit și Ocru (gratuit), Pădure și Teracotă (Control) ---- */
@property --bg{syntax:"<color>";inherits:true;initial-value:#f4f2ea}
@property --card{syntax:"<color>";inherits:true;initial-value:#fff}
@property --tx{syntax:"<color>";inherits:true;initial-value:#1b1f16}
@property --mu{syntax:"<color>";inherits:true;initial-value:#646a58}
@property --ln{syntax:"<color>";inherits:true;initial-value:#e4e0d1}
@property --a1{syntax:"<color>";inherits:true;initial-value:#17664a}
@property --a2{syntax:"<color>";inherits:true;initial-value:#b03d0b}
@property --ha1{syntax:"<color>";inherits:true;initial-value:#11523a}
@property --ha2{syntax:"<color>";inherits:true;initial-value:#1c7752}
@property --hb1{syntax:"<color>";inherits:true;initial-value:#a13808}
@property --hb2{syntax:"<color>";inherits:true;initial-value:#bf4a13}
@property --hc1{syntax:"<color>";inherits:true;initial-value:#29281c}
@property --hc2{syntax:"<color>";inherits:true;initial-value:#4a4830}
html{transition:--bg .7s,--card .7s,--tx .7s,--mu .7s,--ln .7s,--a1 .7s,--a2 .7s,--ha1 .9s,--ha2 .9s,--hb1 .9s,--hb2 .9s,--hc1 .9s,--hc2 .9s}
html[data-motion=off]{transition:none!important}
/* culorile mărcii (pornire, notificări) rămân aceleași pentru toți */
:root{--br1:#11523a;--br2:#1c7752;--brc:#17664a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--br1:#0d4a33;--br2:#17694a;--brc:#74d3a3}}
:root[data-theme="dark"]{--br1:#0d4a33;--br2:#17694a;--brc:#74d3a3}
#spl{background:linear-gradient(135deg,var(--br1),var(--br2))}
#pb .pi{background:var(--br2)}
html[data-plan=free]{--bg:#eff1f2;--card:#fff;--tx:#1a1e24;--mu:#5d6570;--ln:#dde1e5;--a1:#3a4b5e;--a2:#8a5800;--sh:0 1px 2px #1a1e240a,0 12px 30px #1a1e2414;--ha1:#2c3a4a;--ha2:#465b72;--hb1:#7a4c00;--hb2:#9a6300;--hc1:#23272d;--hc2:#454b55}
@media (prefers-color-scheme:dark){html[data-plan=free]:not([data-theme="light"]){--bg:#0f1215;--card:#171b20;--tx:#eceff2;--mu:#a1a9b3;--ln:#262b32;--a1:#a9bdd3;--a2:#e6b560;--on:#0f1215;--sh:0 12px 30px #0008;--ha1:#243140;--ha2:#3a4e64;--hb1:#6a4300;--hb2:#875a05;--hc1:#1a1d22;--hc2:#343a43}}
html[data-plan=free][data-theme="dark"]{--bg:#0f1215;--card:#171b20;--tx:#eceff2;--mu:#a1a9b3;--ln:#262b32;--a1:#a9bdd3;--a2:#e6b560;--on:#0f1215;--sh:0 12px 30px #0008;--ha1:#243140;--ha2:#3a4e64;--hb1:#6a4300;--hb2:#875a05;--hc1:#1a1d22;--hc2:#343a43}
html[data-simple][data-plan=free]{--mu:#454b55}
@media (prefers-color-scheme:dark){html[data-simple][data-plan=free]:not([data-theme=light]){--mu:#c6ccd4}}
html[data-simple][data-plan=free][data-theme=dark]{--mu:#c6ccd4}
/* invitația la Control: o dungă verde, iar foaia Control se arată deja în culorile ei */
html[data-plan=free] .ctl{border-left-color:var(--brc)}
html[data-plan=free] .sheet[data-pal=ctl]{--bg:#f4f2ea;--tx:#1b1f16;--mu:#646a58;--ln:#e4e0d1;--a1:#17664a;--ha1:#11523a;--ha2:#1c7752}
@media (prefers-color-scheme:dark){html[data-plan=free]:not([data-theme="light"]) .sheet[data-pal=ctl]{--bg:#0e110b;--card:#181c13;--tx:#f0f1e8;--mu:#a4a995;--ln:#272b1f;--a1:#74d3a3;--ha1:#0d4a33;--ha2:#17694a}}
html[data-plan=free][data-theme="dark"] .sheet[data-pal=ctl]{--bg:#0e110b;--card:#181c13;--tx:#f0f1e8;--mu:#a4a995;--ln:#272b1f;--a1:#74d3a3;--ha1:#0d4a33;--ha2:#17694a}
.sheet[data-pal=ctl]{--ac:var(--a1);--h1:var(--ha1);--h2:var(--ha2);--gr:linear-gradient(135deg,var(--h1),var(--h2));background:var(--card);color:var(--tx)}

/* atingere pe Android: fără dreptunghiul albastru implicit; apăsarea se vede prin micșorarea butonului */
html{-webkit-tap-highlight-color:transparent}
*{-webkit-tap-highlight-color:transparent}
/* titlul foii primește focus doar pentru cititoarele de ecran, fără inel */
[tabindex="-1"]:focus{outline:none}

.tsel{display:flex;align-items:center;gap:8px}.tsel select{width:auto;min-width:84px;font-variant-numeric:tabular-nums;font-weight:700;text-align:center}.tsel b{font-size:20px}
/* ---- 1.16: interfață în relief (umbre în straturi, lumină de muchie) și mișcare fluidă ---- */
/* elevații: umbre în trei straturi (contact, apropiată, ambientală); se animă doar transform și opacity */
:root{--r1:30px;--r2:22px;--r3:16px;--sd:27 31 22;--hl:#ffffffd9;--gl:linear-gradient(180deg,#ffffff30,#ffffff00 58%);--spr:cubic-bezier(.3,1.3,.5,1);--sht:cubic-bezier(.32,.72,0,1);
--e1:0 1px 1px rgb(var(--sd)/.04),0 2px 5px -1px rgb(var(--sd)/.07),0 12px 22px -12px rgb(var(--sd)/.16);
--e2:0 1px 2px rgb(var(--sd)/.06),0 8px 14px -6px rgb(var(--sd)/.12),0 24px 40px -18px rgb(var(--sd)/.26);
--e3:0 2px 4px rgb(var(--sd)/.08),0 14px 26px -8px rgb(var(--sd)/.18),0 34px 64px -22px rgb(var(--sd)/.36)}
html[data-plan=free]{--sd:26 30 36}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sd:0 0 0;--hl:#ffffff12;--gl:linear-gradient(180deg,#ffffff1f,#ffffff00 58%);--e1:0 1px 2px #00000066,0 12px 22px -12px #000000b3;--e2:0 2px 4px #00000066,0 22px 38px -16px #000000bf;--e3:0 4px 8px #00000073,0 34px 64px -20px #000000cc}}
:root[data-theme="dark"]{--sd:0 0 0;--hl:#ffffff12;--gl:linear-gradient(180deg,#ffffff1f,#ffffff00 58%);--e1:0 1px 2px #00000066,0 12px 22px -12px #000000b3;--e2:0 2px 4px #00000066,0 22px 38px -16px #000000bf;--e3:0 4px 8px #00000073,0 34px 64px -20px #000000cc}

/* suprafețe: muchie luminată sus, contur fin, umbră în straturi */
.card,.lg,.grp,.sp,.cal,.srch,.qa button,.pill,.chips button,.chips a.chip,.two .btn.alt,.prv .btn.alt,.seg.full{box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--ln),var(--e1)}
.al{box-shadow:inset 4px 0 0 var(--wn),inset 0 1px 0 var(--hl),0 0 0 1px var(--ln),var(--e1)}
.al.u{box-shadow:inset 4px 0 0 var(--bd),inset 0 1px 0 var(--hl),0 0 0 1px var(--ln),var(--e1)}
.sheet .chips button{box-shadow:inset 0 1px 0 var(--hl),0 1px 2px rgb(var(--sd)/.1)}
.sg,.stl div,.yr,.code,.cmp>div{box-shadow:inset 0 1px 2px rgb(var(--sd)/.06)}

/* cardul principal: volum, lumină din stânga sus, umbră colorată sub el */
.hero{background:radial-gradient(130% 100% at 8% -12%,#ffffff2e,#ffffff00 56%),radial-gradient(90% 80% at 100% 125%,#00000030,#00000000 62%),var(--gr);box-shadow:inset 0 1px 0 #ffffff4d,inset 0 -1px 0 #00000030,0 2px 4px -1px color-mix(in srgb,var(--h1) 45%,transparent),0 14px 24px -12px color-mix(in srgb,var(--h1) 55%,transparent),0 34px 52px -28px color-mix(in srgb,var(--h2) 85%,transparent)}
.hero:after{content:"";position:absolute;width:170px;height:170px;left:-64px;bottom:-96px;border-radius:50%;background:radial-gradient(circle,#ffffff1c,#fff0 70%);pointer-events:none}
.hero b,.hero h2{text-shadow:0 1px 0 #00000024,0 8px 22px #0000002e}
.ring .rt{stroke:#00000024}
.ring .rf{filter:drop-shadow(0 2px 3px #00000047)}

/* butoane: gradient cu lumină sus, margine întunecată jos, apăsare elastică */
.btn{background:var(--gl),var(--gr);box-shadow:inset 0 1px 0 #ffffff52,inset 0 -2px 0 #00000026,0 1px 2px rgb(var(--sd)/.2),0 12px 22px -12px var(--h2);text-shadow:0 1px 1px #00000029;transition:transform .4s var(--spr),opacity .2s}
.btn:active{transform:translateY(1px) scale(.975);transition-duration:.12s}
.btn.alt{background:var(--card);text-shadow:none;box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--ln),var(--e1)}
.chips button.on,.seg button.on,.cday.on,.rb,.cmp .h.y{background:var(--gl),var(--gr);box-shadow:inset 0 1px 0 #ffffff47,inset 0 -1px 0 #00000026,0 6px 14px -8px var(--h2)}
.seg.full button.on{background:none;box-shadow:none}
.seg.full:before{background:var(--gl),var(--gr);box-shadow:inset 0 1px 0 #ffffff4d,inset 0 -1px 0 #00000026,0 6px 14px -8px var(--h2);transition:transform .6s var(--spr);will-change:transform}

/* bara de jos: plutește deasupra conținutului; indicatorul alunecă cu un mic resort */
.pn{box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--ln),0 4px 10px -4px rgb(var(--sd)/.16),0 24px 46px -14px rgb(var(--sd)/.34)}
.ind{background:var(--gl),var(--gr);box-shadow:inset 0 1px 0 #ffffff5c,inset 0 -2px 3px #00000029,0 2px 4px -1px rgb(var(--sd)/.22),0 10px 18px -8px var(--h2);transition:transform .62s var(--spr);will-change:transform}
.pn button.on{text-shadow:0 1px 1px #00000033}

/* comutator: șină adâncită, buton sferic */
.sw{box-shadow:inset 0 1px 3px rgb(var(--sd)/.24),inset 0 0 0 1px rgb(var(--sd)/.05)}
.sw.on{background:var(--gl),var(--gr);box-shadow:inset 0 1px 3px #00000038}
.sw:after{background:radial-gradient(circle at 35% 30%,#fff,#f2f0e9 62%,#dedacd);box-shadow:0 1px 1px #00000030,0 3px 8px #00000038;transition:transform .45s var(--spr)}

/* câmpuri: ușor adâncite; la focus, un inel moale în culoarea meniului */
input,select,textarea{box-shadow:inset 0 1px 2px rgb(var(--sd)/.08)}
input:focus,select:focus,textarea:focus{box-shadow:inset 0 1px 2px rgb(var(--sd)/.08),0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
input[type=checkbox]{box-shadow:none}

/* plăcuța cu data din listă */
.lf{box-shadow:inset 0 1px 0 var(--hl),inset 0 -1px 0 rgb(var(--sd)/.07)}
.lf.d{background:linear-gradient(180deg,#ffffff2e,#ffffff00 60%),var(--bd);box-shadow:inset 0 1px 0 #ffffff47,0 6px 12px -6px var(--bd)}
.tl li:before{background:radial-gradient(circle at 35% 30%,#ffffff70,#fff0 60%),var(--gr);box-shadow:0 0 0 3px var(--card),0 2px 4px rgb(var(--sd)/.25)}

/* foi, notificări, mesaje, widgeturi */
.ov{background:#0b0f0899}
.sheet{box-shadow:inset 0 1px 0 var(--hl),0 -24px 56px -24px #00000066;transition:transform .55s var(--sht);will-change:transform}
.toast{box-shadow:var(--e3)}
#pb>button{box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--ln),var(--e3)}
.wg{box-shadow:inset 0 1px 0 var(--hl),0 2px 4px #00000026,0 16px 28px -14px #0000008c}

/* tastatura PIN: taste bombate care se adâncesc la apăsare */
.pad button{background:var(--gl),var(--card);box-shadow:inset 0 1px 0 var(--hl),0 0 0 1px var(--ln),0 4px 10px -4px rgb(var(--sd)/.2);transition:transform .3s var(--spr)}
.pad button:active{background:var(--bg);box-shadow:inset 0 2px 6px rgb(var(--sd)/.2),0 0 0 1px var(--ln);transform:scale(.94);transition-duration:.08s}
.pad button.sm,.pad button.sm:active{background:none;box-shadow:none}

/* intrarea conținutului: mai lină, pe placa grafică (translate3d) */
@keyframes in{from{opacity:0;transform:translate3d(var(--dx,0),14px,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.86)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
#main.go>*{animation:in .6s var(--sp) both;animation-delay:calc(var(--i,0)*40ms)}

/* la pornire culorile se pun direct, fără tranziție: tranziția culorilor recalculează toată pagina la fiecare cadru; rămâne doar pentru schimbarea planului */
html:not([data-rdy]){transition:none!important}

/* ---- ecranul de pornire: emblema în relief se ridică, simbolul se desenează, o lumină trece o dată ---- */
#spl{background:radial-gradient(110% 70% at 50% 36%,#ffffff21,#ffffff00 62%),radial-gradient(150% 110% at 50% 50%,#00000000 52%,#0000004d),linear-gradient(160deg,var(--br1),var(--br2))}
.spw{gap:26px}
.spx{position:relative;width:min(172px,44vw);aspect-ratio:1;transition:transform .5s var(--sp),opacity .4s ease}
.spe{position:absolute;inset:0;animation:spr .95s cubic-bezier(.2,1.25,.4,1) both;will-change:transform,opacity}
.spd{position:absolute;inset:3.5%;border-radius:50%;background:radial-gradient(circle at 34% 26%,#2f9a6d,#1a6e4e 44%,#0b3a28);box-shadow:inset 0 3px 2px -1px #ffffff57,inset 0 -12px 24px #0000005e,0 2px 3px #00000052,0 22px 34px -14px #000000ad}
#spl .sps{position:absolute;inset:0;width:100%;height:100%}
.shn{position:absolute;inset:3.5%;border-radius:50%;overflow:hidden;pointer-events:none}
.shn:before{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:55%;background:linear-gradient(100deg,#fff0,#ffffff42 50%,#fff0);transform:translateX(-130%) skewX(-12deg);animation:shn .65s cubic-bezier(.45,0,.2,1) 1s both}
.sph{position:absolute;left:14%;right:14%;bottom:-24px;height:22px;border-radius:50%;background:radial-gradient(closest-side,#0000005e,#00000000);animation:sph .95s cubic-bezier(.2,1.25,.4,1) both}
#spl .spm{animation:spm .7s var(--sp) .5s both;transition:transform .5s var(--sp),opacity .35s ease}
#spl.off .spx{transform:scale(1.12);opacity:0}
#spl.off .spm{transform:translate3d(0,10px,0);opacity:0}
#spl.q .spe,#spl.q .sph,#spl.q .shn:before,#spl.q .spm{animation:none}
html[data-motion=off] #spl .d{stroke-dasharray:none;stroke-dashoffset:0}
@keyframes spr{from{opacity:0;transform:perspective(640px) translate3d(0,30px,0) rotateX(38deg) scale(.7)}45%{opacity:1}to{opacity:1;transform:perspective(640px) translate3d(0,0,0) rotateX(0) scale(1)}}
@keyframes sph{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes shn{to{transform:translateX(260%) skewX(-12deg)}}
@keyframes spm{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
/* liniile simbolului nu mai lasă un punct vizibil înainte să înceapă desenul */
@keyframes spd{0%{opacity:0}6%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
.two>.btn.alt{margin-top:0}
</style>
