function icsText(it,feed){
 const e=v=>String(v==null?"":v).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"),
  fold=l=>{let o="";while(l.length>60){o+=l.slice(0,60)+"\r\n ";l=l.slice(60)}return o+l},
  st=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),
  L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LaTimp//RO","CALSCALE:GREGORIAN"].concat(feed?["METHOD:PUBLISH","X-WR-CALNAME:LaTimp","REFRESH-INTERVAL;VALUE=DURATION:PT6H","X-PUBLISHED-TTL:PT6H"]:[]);
 it.forEach(x=>{
  const d=pd(x.d),n=new Date(d);n.setDate(n.getDate()+1);
  const per=x.g=="sub"?(x.c=="y"?12:1):(+x.rep||0),
   rp=!per?"":per%12==0?"FREQ=YEARLY"+(per>12?";INTERVAL="+per/12:""):"FREQ=MONTHLY"+(per>1?";INTERVAL="+per:""),
   hm=ntH().split(":").map(Number),al=remDays(x).map(k=>{const m=k*1440-(hm[0]*60+hm[1]);return m>=0?"-PT"+m+"M":"PT"+(-m)+"M"});
  L.push("BEGIN:VEVENT","UID:"+x.id+"@latimp","DTSTAMP:"+st,"DTSTART;VALUE=DATE:"+fmt(d).replace(/-/g,""),"DTEND;VALUE=DATE:"+fmt(n).replace(/-/g,""),"SUMMARY:"+e(ttl(x)||"Termen"));
  if(x.note)L.push("DESCRIPTION:"+e(x.note));
  if(rp)L.push("RRULE:"+rp);
  al.forEach(a=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+e(ttl(x)||"Termen"),"TRIGGER:"+a,"END:VALARM"));
  L.push("END:VEVENT")});
 L.push("END:VCALENDAR");
 return L.map(fold).join("\r\n")+"\r\n"}

/* ---------- poză: citire cu serviciul AI ---------- */
function parseJ(t){t=String(t||"").replace(/```json|```/g,"");const a=t.search(/[\[{]/);if(a<0)return null;const e=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));try{return JSON.parse(t.slice(a,e+1))}catch(x){return null}}
function shrink(f,max,q){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error("blob")),"image/jpeg",q)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("img"))};im.src=u})}

 if(!S.pro&&S.photos>=FREE_PHOTOS){toast("Ai folosit cele "+FREE_PHOTOS+" citiri gratuite din poză.");openPlan("agenda");return}

 if(!S.aic){
  openSheet(intro+`<div class="sg"><b>Acordul tău, o singură dată</b>Poza pe care o alegi este trimisă către un serviciu de inteligență artificială, care o citește și returnează câmpurile. Aplicația trimite doar poza și instrucțiunea de citire, nu și restul agendei tale, și nu păstrează poza. Acoperă CNP-ul, numerele de card și alte date sensibile. Poți retrage acordul oricând din Mai mult.</div><div style="margin-top:14px"><button class="btn" onclick="photoOk()">Sunt de acord</button><button class="btn alt" onclick="closeSheet()">Renunță</button></div>`,"photo");return}
 openSheet(intro+`<div class="sg"><b>Înainte să trimiți poza</b>Poza este trimisă către un serviciu de inteligență artificială, care o citește. Aplicația nu o păstrează. Acoperă CNP-ul, numerele de card și alte date sensibile.</div><label for="ph">Poză</label><input id="ph" type="file" accept="${esc(PHT.join(","))}" onchange="photoRead(this.files[0])"><div id="phs" class="note" role="status"></div><button class="btn alt" onclick="closeSheet()">Renunță</button>`,"photo")}

async function photoRead(f){
 if(!f)return;const st=$("phs");st.textContent="Citesc poza…";
 try{
  const b=await shrink(f,1600,.82);
  const p=`Ești un asistent care citește documente românești: poliță RCA, rovinietă, fișă ITP, talon, factură de abonament. Citește doar ce se vede în poză. Dacă un câmp nu se vede clar, pune null; nu ghici și nu inventa. Răspunde DOAR cu JSON, fără alt text: {"tip":"itp"|"rca"|"rov"|"talon"|"abonament"|"alta","nume":"furnizor sau nume scurt, sau null","nr":"număr de înmatriculare sau null","data":"data de expirare sau a următoarei plăți, format YYYY-MM-DD, sau null","pret":"număr sau null","perioada":"lunar"|"anual"|null}`;
  const o=await AI(p,{images:[b],cache:false}),r=parseJ(o.text);
  if(!r||typeof r!="object")throw new Error("parse");
  const t=String(r.tip||""),d=okDate(r.data)?r.data:"",txt=v=>v==null||v=="null"?"":String(v).slice(0,60);
  if(t=="itp"||t=="rca"||t=="rov"||t=="talon")cur={g:"auto",t:t=="talon"?"alt":t,n:txt(r.nr),d,rep:(AT.find(a=>a[0]==t)||[0,0])[1],note:t=="rca"?txt(r.nume):"",fromPhoto:1};
  else{const p2=parseFloat(r.pret);cur={g:"sub",t:"sub",e:"📦",n:txt(r.nume),p:p2>=0?p2:"",c:r.perioada=="anual"?"y":"m",d,rep:0,note:"",fromPhoto:1}}
  S.photos=(S.photos||0)+1;if(S.stats)S.st.reads=(S.st.reads||0)+1;save();drawItem(false)}
 catch(e){st.textContent="Nu am putut citi poza. Încearcă o poză mai clară sau completează manual."}}

 h+=`<label class="ck"><input id="o_s" type="checkbox"${OB.st?" checked":""}> Ajută la îmbunătățirea aplicației cu statistici de utilizare, fără conținutul agendei. Poți opri oricând.</label><div style="margin-top:18px"><button class="btn" onclick="obDone()">${OB.car?"Gata":"Continuă"}</button><button class="btn alt" onclick="obSkip()">Sări peste</button></div>`;

function obDone(){
 obGrab();let k=0;
 if(OB.car){const pl=OB.plate.trim().toUpperCase();let kk=null;
  if(pl||okDate(OB.itp)||okDate(OB.rca)){const nm=pl||"Mașina mea";kk=findCar(nm);if(!kk){kk={id:uid(),n:nm};S.cars.push(kk)}}
  if(okDate(OB.itp)){S.items.push({id:uid(),g:"auto",t:"itp",n:kk.n,car:kk.id,d:OB.itp,rep:24,note:""});k++}
  if(okDate(OB.rca)){S.items.push({id:uid(),g:"auto",t:"rca",n:kk.n,car:kk.id,d:OB.rca,rep:12,note:OB.ins.trim()});k++}}
 if(k)S.items=S.items.filter(x=>!x.ex);
 S.onb=true;S.stats=!!OB.st;if(S.stats){S.st.adds=(S.st.adds||0)+k;touch()}
 save();closeSheet();render();toast(k?"Gata, termenele sunt în agendă":"Gata");obAcct()}
function obAcct(){if(!S.acct)setTimeout(()=>{if(!S.acct&&!$("ov").classList.contains("on"))acctOpen("",null,true)},450)}
function obSkip(){obGrab();S.onb=true;S.stats=!!OB.st;if(S.stats)touch();save();closeSheet();render();obAcct()}

 [/onomastic/,"per","onom"],[/ziua (lui|ei)|\bziua\b|zi de nastere|\bla multi ani\b/,"per","zi"],[/aniversar/,"per","anv"],[/concert|spectacol|\bmeci\b|festival/,"per","ev"],[/programare|\bdoctor/,"per","prog"]];
function qaDate(s,take){
 const mk=(d,mo,y)=>{if(mo<0||mo>11||d<1||d>31)return null;let yy=y?+y:td().getFullYear();if(y&&String(y).length==2)yy=2000+(+y);if(!y&&mo==1&&d==29){while(new Date(yy,1,29).getMonth()!=1||new Date(yy,1,29)<td())yy++}const dt=new Date(yy,mo,d);if(dt.getMonth()!=mo)return null;return fmt(!y&&dt<td()?new Date(yy+1,mo,d):dt)};
 let m;
 if(take(/\bpoimaine\b/))return plus(2);
 if(take(/\bmaine\b/))return plus(1);
 if(take(/\bazi\b/))return plus(0);
 if(m=take(/\b(peste|in) (\d{1,3}) (zile|zi|saptamani|saptamana|luni|luna|ani|an)\b/)){const n=+m[2],u=m[3],d=td();if(u.startsWith("zi"))d.setDate(d.getDate()+n);else if(u.startsWith("sapt"))d.setDate(d.getDate()+7*n);else if(u.startsWith("lun"))return fmt(addM(d,n));else d.setFullYear(d.getFullYear()+n);return fmt(d)}
 if(m=take(/\b(\d{1,2}) ?(ianuarie|februarie|martie|aprilie|mai|iunie|iulie|august|septembrie|octombrie|noiembrie|decembrie|ian|feb|mar|apr|iun|iul|aug|sept|sep|oct|noi|nov|dec)\.?(?: (\d{4}))?\b/)){const k=m[2].slice(0,3)=="noi"?"nov":m[2].slice(0,3);return mk(+m[1],MON.indexOf(k),m[3])}
 if(m=take(/\b(\d{1,2})[./-](\d{1,2})(?:[./-](\d{4}|\d{2}))?\b/))return mk(+m[1],+m[2]-1,m[3]);
 return null}
function qaParse(raw){
 const o=String(raw||"").replace(/\s+/g," ").trim().slice(0,120),s=dia(o),mask=new Array(o.length).fill(false);
 const take=re=>{const m=re.exec(s);if(!m)return null;for(let i=m.index;i<m.index+m[0].length;i++)mask[i]=true;return m};
 let p=null;const pm=take(/(\d+(?:[.,]\d{1,2})?) ?(lei|ron)\b/);if(pm)p=parseFloat(pm[1].replace(",","."));
 const d=qaDate(s,take);
 let g="per",t="alt";
 for(const k of QK){const m=k[0].exec(s);if(m){g=k[1];t=k[2];if(g!="sub")for(let i=m.index;i<m.index+m[0].length;i++)mask[i]=true;break}}
 let n=o.split("").filter((c,i)=>!mask[i]).join("").replace(/\s+/g," ").replace(/^[\s,.;:–-]+|[\s,.;:–-]+$/g,"").replace(/^(pe|la|de|pentru|lui|ei)\s+/i,"").trim().slice(0,40);
 if(n)n=n.charAt(0).toUpperCase()+n.slice(1);
 return {g,t,n,d,p}}

<script>
/* ---------- Familie: termene distribuite, criptate cu un cod ---------- */
const FA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let FAMV=[],FKEY=null,FH="",famUnsub=null,FTK=0,lastFam="",FM={};
const b64=u=>{let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const normCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const fmtCode=c=>c.slice(0,5)+"-"+c.slice(5);
const cryptoOk=()=>!!(window.crypto&&crypto.subtle);
async function derive(code){
 const en=new TextEncoder(),base=await crypto.subtle.importKey("raw",en.encode(code),"PBKDF2",false,["deriveBits","deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:en.encode("buzunar-fam-k1"),iterations:120000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
 const h=await crypto.subtle.deriveBits({name:"PBKDF2",salt:en.encode("buzunar-fam-h1"),iterations:120000,hash:"SHA-256"},base,256);
 return{key,h:hex(h)}}
async function encr(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function decr(key,s){const u=unb64(s),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12));return JSON.parse(new TextDecoder().decode(pt))}
async function famSetup(){
 const tk=++FTK;
 if(famUnsub){famUnsub();famUnsub=null}FAMV=[];FKEY=null;FH="";
 if(!S.fam||!DB||!UID||!cryptoOk())return;
 try{
  const d=await derive(S.fam.code);if(tk!=FTK)return;FKEY=d.key;FH=d.h;
  famUnsub=DB.collection("fam").where("h","==",FH).onSnapshot(async snap=>{
   const out=[];
   for(const dd of snap.docs){if(dd.id==UID)continue;try{const p=await decr(FKEY,(dd.data()||{}).b);out.push({u:dd.id,w:clip(p.w,30),it:(Array.isArray(p.it)?p.it:[]).slice(0,100),gc:(Array.isArray(p.gc)?p.gc:[]).slice(0,50)})}catch(e){}}
   if(tk!=FTK)return;FAMV=out;soft()},()=>{});
  famQ()}
 catch(e){}}
const famQ=writer(async()=>{
 if(!DBU()||!S.fam||!FKEY)return;
 const it=S.items.filter(x=>x.sh&&x.g!="sub").slice(0,100).map(x=>({n:ttl(x),d:x.d,t:x.t,g:x.g,rep:x.rep||0,a:x.auto?1:0})),gc=famGifts(),sig=JSON.stringify([FH,S.fam.who,it,gc]);
 if(sig==lastFam)return;
 const b=await encr(FKEY,{w:S.fam.who,it,gc});await DB.doc("fam/"+UID).set({h:FH,b,at:Date.now()});lastFam=sig},1500);
function famCard(){
 if(CFG.flags.fam===false)return"";
 if(!S.fam)return `<div class="card"><strong>Familie</strong><div class="mu" style="margin-top:4px">Împarte cu cei apropiați termenele pe care le alegi tu. Face parte din Control.</div><button class="btn alt" onclick="famOpen()">Pornește</button></div>`;
 const rows=[];
 FAMV.forEach(m=>m.it.forEach(i=>{if(!okDate(i.d))return;let d=pd(i.d),n=0;if(i.a&&i.rep>0)while(d<td()&&n++<600)d=addM(d,i.rep);rows.push({w:m.w,n:clip(i.n,60),d:fmt(d)})}));
 rows.sort((a,b)=>left(a.d)-left(b.d));
 return `<div class="card"><div class="top"><strong>Familie</strong><span class="mu">${FAMV.length+1} ${FAMV.length?"persoane":"persoană"}</span></div>${rows.slice(0,6).map(r=>`<div class="top" style="margin-top:8px"><span>${esc(r.w)} · ${esc(r.n)}</span><span class="mu">${nice(r.d)}</span></div>`).join("")||`<div class="mu" style="margin-top:6px">Încă nu a distribuit nimeni un termen.</div>`}<div class="acts"><button onclick="famOpen()">Gestionează</button></div></div>`}
function famOpen(){FM={};
 if(!S.pro){toast("Familia face parte din Control.");openPlan("agenda");return}
 if(needAcct("Pentru familie ai nevoie de un cont, ca să vă găsiți unii pe alții.",famOpen))return;
 if(!cryptoOk()||!DB||!UID){openSheet(`<h2>Familie</h2><div class="mu">Pentru familie ai nevoie de un cont conectat și de baza de date a aplicației. Aici nu sunt disponibile.</div><button class="btn alt" onclick="closeSheet()">Închide</button>`,"fam");return}
 drawFam()}
function drawFam(msg){
 let h=`<h2>Familie</h2>`;
 if(!S.fam)h+=`<div class="mu">Creezi un cod și îl dai celor apropiați. Fiecare vede termenele pe care alege să le distribuie, nu și prețurile abonamentelor.</div><label for="fw">Cum te numesc ceilalți?</label><input id="fw" maxlength="30" placeholder="De exemplu: Mama" value="${esc(FM.w||"")}"><div style="margin-top:14px"><button class="btn" onclick="famCreate()">Creează codul de familie</button></div><label for="fc">Ai deja un cod?</label><input id="fc" maxlength="14" placeholder="XXXXX-XXXXX" autocapitalize="characters" value="${esc(FM.c||"")}"><button class="btn alt" onclick="famJoin()">Intră în familie</button>`;
 else h+=`<div class="mu">Codul tău de familie. Dă-l doar celor în care ai încredere.</div><div class="code" id="fcode">${fmtCode(S.fam.code)}</div><button class="btn alt" onclick="famCopy()">Copiază invitația</button><label for="fw">Cum te numesc ceilalți?</label><input id="fw" maxlength="30" value="${esc(S.fam.who)}" onchange="famWho(this.value)"><div class="note">${FAMV.length?"Mai sunt "+FAMV.length+" "+(FAMV.length==1?"persoană":"persoane")+" în familie.":"Nimeni altcineva nu a intrat încă."} Ca să distribui un termen, bifează „Distribuie cu familia” în ecranul lui.</div><div class="sg"><b>Cum e protejat</b>Termenele sunt criptate pe dispozitiv cu acest cod înainte să plece. Fără cod, nu pot fi citite din baza de date. Dacă un cod ajunge la cine nu trebuie, ieși și creează altul.</div><button class="btn alt dg" onclick="famLeave()">${FM.leave?"Apasă din nou ca să ieși":"Ieși din familie"}</button>`;
 if(msg)h+=`<div class="note dg" role="alert">${esc(msg)}</div>`;
 openSheet(h+`<button class="btn alt" onclick="closeSheet()">Închide</button>`,"fam")}
function famStart(code){const w=($("fw").value||"").trim().slice(0,30)||"Eu";S.fam={code,who:w};FM={};lastFam="";save();famSetup().then(()=>{drawFam();render()})}
function famCreate(){const a=crypto.getRandomValues(new Uint8Array(10));let c="";a.forEach(v=>c+=FA[v%32]);famStart(c)}
function famJoin(){const c=normCode($("fc").value);FM.w=$("fw").value;FM.c=$("fc").value;if(c.length!=10){drawFam("Codul are 10 caractere, de exemplu XXXXX-XXXXX.");return}famStart(c)}
function famWho(v){S.fam.who=v.trim().slice(0,30)||"Eu";lastFam="";save()}
function famCopy(){
 const t="Intră în familia mea din LaTimp cu codul "+fmtCode(S.fam.code)+".";
 const sel=()=>{const r=document.createRange();r.selectNodeContents($("fcode"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selectează și copiază codul")};
 try{navigator.clipboard.writeText(t).then(()=>toast("Invitația a fost copiată"),sel)}catch(e){sel()}}
async function famLeave(){
 if(!FM.leave){FM.leave=1;drawFam();return}
 FM={};S.fam=null;S.items.forEach(x=>{delete x.sh});lastFam="";save();
 if(DBU()){try{await DB.doc("fam/"+UID).delete()}catch(e){}}
 await famSetup();closeSheet();render();toast("Ai ieșit din familie")}
</script>
<script>
/* ---------- Etapa 3: weekend, minivacanțe, provocarea lunii, liste de încercat, plan cu prietenii, recomandări ---------- */
const WD=d=>d.toLocaleDateString(LOC(),{weekday:"short",day:"numeric",month:"short"});
/* zile libere legale în România (Codul muncii), calculate pentru anul trecut, anul curent și următorii doi */
function easterOrth(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),day=(d+e+114)%31+1;const j=new Date(y,m-1,day);j.setDate(j.getDate()+13);return j}
function holYear(y){const E=easterOrth(y),o=n=>{const d=new Date(E);d.setDate(d.getDate()+n);return fmt(d)},f=(m,d)=>y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
 return[[f(1,1),"Anul Nou"],[f(1,2),"A doua zi de Anul Nou"],[f(1,6),"Boboteaza"],[f(1,7),"Sfântul Ioan"],[f(1,24),"Ziua Unirii"],[o(-2),"Vinerea Mare"],[o(0),"Paștele"],[o(1),"A doua zi de Paște"],[f(5,1),"Ziua Muncii"],[f(6,1),"Ziua Copilului"],[o(49),"Rusaliile"],[o(50),"A doua zi de Rusalii"],[f(8,15),"Adormirea Maicii Domnului"],[f(11,30),"Sfântul Andrei"],[f(12,1),"Ziua Națională"],[f(12,25),"Crăciunul"],[f(12,26),"A doua zi de Crăciun"]]}
const HOL=(()=>{const y=new Date().getFullYear(),m=new Map();[y-1,y,y+1,y+2].forEach(Y=>holYear(Y).forEach(([d,n])=>m.set(d,m.has(d)?m.get(d)+", "+n:n)));return[...m].sort((a,b)=>a[0]<b[0]?-1:1)})();
const isOff=d=>{const w=d.getDay();return w==0||w==6||HOL.some(h=>h[0]==fmt(d))};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
/* minivacanțe: zilele libere legate de fiecare sărbătoare din timpul săptămânii, plus varianta cu o zi de concediu */
function breaks(){
 const out=[],seen=new Set(),t=td();
 HOL.forEach(([ds])=>{
  const h=pd(ds);if(h<t||h.getDay()==0||h.getDay()==6)return;
  let a=h,b=h;while(isOff(addD(a,-1)))a=addD(a,-1);while(isOff(addD(b,1)))b=addD(b,1);
  const k=fmt(a);if(seen.has(k))return;seen.add(k);
  const n=Math.round((b-a)/DAY)+1;let best=null;
  [[addD(a,-1),-1],[addD(b,1),1]].forEach(([g,dir])=>{if(isOff(g))return;let e=addD(g,dir),m=0;while(isOff(e)){m++;e=addD(e,dir)}if(m)best=!best||m>best.m?{g,m,dir}:best});
  const names=HOL.filter(x=>pd(x[0])>=a&&pd(x[0])<=b).map(x=>x[1]);
  const o={a,b,n,names};
  if(best){o.leave=best.g;o.ln=n+1+best.m;o.la=best.dir<0?addD(best.g,-best.m):a;o.lb=best.dir>0?addD(best.g,best.m):b}
  out.push(o)});
 return out.sort((x,y)=>x.a-y.a)}
const rng=(a,b)=>WD(a)+" – "+WD(b);
function breakLine(o){return `${esc(rng(o.a,o.b))}: ${o.n} ${o.n==1?"zi liberă":"zile libere"}${o.leave?`, sau ${o.ln} cu o zi de concediu (${esc(WD(o.leave))})`:""}`}
function holShow(){
 const l=breaks();
 openSheet(`<h2>Zile libere și minivacanțe</h2><div class="mu">Sărbătorile legale din timpul săptămânii și cât de lungă poate fi pauza.</div>${l.map(o=>`<div class="ar" style="display:block"><b>${esc(o.names.join(", "))}</b><div class="mu">${breakLine(o)}</div></div>`).join("")||`<div class="mu">Nu mai sunt sărbători legale în timpul săptămânii în perioada calculată.</div>`}<div class="note">Zilele libere legale din Codul muncii, până la sfârșitul lui 2027. Unele firme au reguli proprii pentru zilele de punte.</div><button class="btn alt" onclick="closeSheet()">Închide</button>`,"hol")}
/* weekendul: ce ai deja în agendă, vremea aleasă de tine, idei potrivite */
function wkndDays(){const t=td(),w=t.getDay();const sat=w==6?t:w==0?addD(t,-1):addD(t,6-w);return[sat,addD(sat,1)]}
function wkndBusy(){const[s,u]=wkndDays();return S.items.filter(x=>!x.ex&&okDate(x.d)&&(x.d==fmt(s)||x.d==fmt(u))).map(x=>(x.d==fmt(s)?"sâmbătă":"duminică")+": "+ttl(x))}
function forYou(){
 const[s,u]=wkndDays(),busy=wkndBusy(),br=breaks().find(o=>(o.a-td())/DAY<=45),wx=FLT.wx;
 let h=`<div class="card fy"><strong>Weekendul tău, ${esc(WD(s))} – ${esc(WD(u))}</strong><div class="mu" style="margin-top:4px">${busy.length?"Ai deja în agendă: "+esc(busy.join("; "))+".":"Nu ai nimic în agendă în weekend."}</div>${budWk()?`<div class="mu sm" style="margin-top:4px">Buget de ieșiri: cam ${money(budWk())} lei pe weekend.</div>`:""}<label>Cum e vremea?</label><div class="chips f">${FW[2][2].map(v=>`<button class="${wx==v?"on":""}" onclick="FLT.wx=FLT.wx=='${v}'?'':'${v}';render()">${v}</button>`).join("")}</div><div class="acts"><button onclick="wkndIdeas()">Idei pentru weekend</button></div>`;
 if(br)h+=`<div class="fyb"><strong>Minivacanță: ${esc(br.names.join(", "))}</strong><div class="mu">${breakLine(br)}</div>${brNote(br)}<div class="acts"><button onclick="brIdeas()">Idei pentru minivacanță</button><button onclick="holShow()">Toate zilele libere</button></div></div>`;
 else h+=`<div class="acts"><button onclick="holShow()">Zile libere și minivacanțe</button></div>`;
 return h+`<div class="note">Prognoza automată vine cu aplicația instalată. Până atunci, alegi tu vremea.</div></div>`+chCard()}
function wkndIdeas(){const b=wkndBusy(),bb=budBucket();if(bb)BUD=bb;FLT.time="O zi";DET=(b.length?"În weekend am deja: "+b.join("; ")+". ":"")+(FLT.wx?"Vremea: "+FLT.wx.toLowerCase()+".":"");DET=DET.slice(0,200);ADJ=true;askIdeas()}
function brIdeas(){const o=breaks()[0];if(!o)return;FLT.time="Weekend";DET=("Avem "+o.n+" zile libere, "+rng(o.a,o.b)+". Vrem o mică vacanță sau ieșiri.").slice(0,200);ADJ=true;askIdeas()}

/* provocarea lunii: o ieșire nouă pe lună, fără presiune */
const mKey=(d=td())=>fmt(d).slice(0,7);
const mName=k=>{const d=pd(k+"-01"),m=d.toLocaleDateString(LOC(),{month:"long"});return m.charAt(0).toUpperCase()+m.slice(1)};
function chStreak(){const m=(S.ch&&S.ch.m)||{};let d=new Date(td().getFullYear(),td().getMonth(),1),n=0;if(!m[mKey(d)])d=addM(d,-1,1);while(m[mKey(d)]&&n<240){n++;d=addM(d,-1,1)}return n}
function chCard(){
 const c=S.ch||{};
 if(!c.on)return `<div class="card xs"><div class="top"><strong>Provocare: ceva nou în fiecare lună</strong><button class="lkb" onclick="chSet(true)">Pornește</button></div><div class="mu" style="margin-top:4px">O ieșire sau o activitate pe care n-ai mai făcut-o. Bifezi când ai făcut-o. Fără notificări.</div></div>`;
 const k=mKey(),done=c.m&&c.m[k],st=chStreak();
 return `<div class="card ch"><div class="top"><strong>Provocarea lunii · ${mName(k)}</strong><span class="tag${done?" ok":""}">${done?"făcută":"încă nu"}</span></div><div class="mu" style="margin-top:4px">${done?"Ai făcut: "+esc(done.t)+".":"Ceva nou luna asta: un loc, o activitate, o rețetă."} ${st?"Serie: "+st+(st==1?" lună":" luni")+" la rând.":""}</div><div class="acts">${done?`<button onclick="chDone()">Schimbă</button>`:`<button onclick="chDone()">Am făcut-o</button>`}<button class="g" onclick="chSet(false)">Oprește provocarea</button></div></div>`}
function chSet(v){S.ch=Object.assign({m:{}},S.ch||{},{on:!!v});save();render();toast(v?"Provocarea e pornită":"Provocarea e oprită. Ce ai bifat rămâne.")}
function chDone(){
 const sv=(S.saved||[]).slice(0,6),cur0=(S.ch&&S.ch.m&&S.ch.m[mKey()]||{}).t||"";
 openSheet(`<h2>Ce ai făcut nou?</h2><label for="ch_t">Pe scurt</label><input id="ch_t" maxlength="80" value="${esc(cur0)}" placeholder="De exemplu: am fost la un atelier de ceramică">${sv.length?`<label>Sau alege din ideile salvate</label><div class="chips">${sv.map((x,i)=>`<button onclick="$('ch_t').value=(S.saved[${i}]||{}).t||''">${esc(x.t)}</button>`).join("")}</div>`:""}<div style="margin-top:14px"><button class="btn" onclick="chSave()">Bifează luna</button>${cur0?`<button class="btn alt dg" onclick="chSave(1)">Scoate bifa</button>`:""}<button class="btn alt" onclick="closeSheet()">Renunță</button></div>`,"ch")}
function chSave(rm){
 S.ch=Object.assign({on:true,m:{}},S.ch||{});S.ch.m=S.ch.m||{};const k=mKey();
 if(rm){delete S.ch.m[k];save();closeSheet();render();return}
 const t=(($("ch_t")||{}).value||"").trim().slice(0,80);if(!t){toast("Scrie pe scurt ce ai făcut");return}
 S.ch.m[k]={t,d:fmt(td())};const ks=Object.keys(S.ch.m).sort();while(ks.length>60)delete S.ch.m[ks.shift()];
 save();closeSheet();render();const st=chStreak();toast(st>1?"Bravo! "+st+" luni la rând.":"Bifat pentru "+mName(k).toLowerCase()+".")}

/* liste „de încercat” */
const TLK=[["film","Filme"],["carte","Cărți"],["rest","Restaurante"],["loc","Locuri"],["alt","Altele"]];
let TLF="film";
function listsView(){
 const l=(Array.isArray(S.tl)?S.tl:[]).filter(x=>x.k==TLF),open=l.filter(x=>!x.dn),done=l.filter(x=>x.dn),nm=(TLK.find(k=>k[0]==TLF)||TLK[0])[1];
 const row=x=>`<div class="it tli"><label class="ck" style="margin:0"><input type="checkbox"${x.dn?" checked":""} onchange="tlDone('${x.id}')"> <span${x.dn?' class="mu" style="text-decoration:line-through"':""}>${esc(x.n)}</span></label><button class="x" aria-label="Șterge ${esc(x.n)}" onclick="tlDel('${x.id}')">✕</button></div>`;
 return `<div class="gt">Liste de încercat</div><div class="chips f sc">${TLK.map(k=>{const c=(S.tl||[]).filter(x=>x.k==k[0]&&!x.dn).length;return `<button class="${TLF==k[0]?"on":""}" onclick="TLF='${k[0]}';render()">${k[1]}${c?" "+c:""}</button>`}).join("")}</div>
 <div class="qa"><input id="tl_n" maxlength="80" placeholder="Adaugă la ${esc(nm.toLowerCase())}" aria-label="Adaugă în listă" onkeydown="if(event.key=='Enter')tlAdd()"><button onclick="tlAdd()">Adaugă</button></div>
 <div class="grp" style="margin-top:10px">${open.map(row).join("")||`<div class="it"><span class="mu">Nimic aici încă. Scrie ce vrei să încerci.</span></div>`}${done.length?done.slice(0,20).map(row).join(""):""}</div>${open.length?`<div class="acts"><button onclick="tlIdeas()">Idei din lista mea</button></div>`:""}`}
function tlAdd(){const e=$("tl_n"),n=(e?e.value:"").trim().slice(0,80);if(!n){toast("Scrie ce vrei să adaugi");return}S.tl=Array.isArray(S.tl)?S.tl:[];if(S.tl.length>=300){toast("Lista e plină. Șterge ce ai încercat.");return}S.tl.unshift({id:uid(),k:TLF,n,dn:false});save();render();const f=$("tl_n");if(f)f.focus()}
function tlDone(id){const x=(S.tl||[]).find(i=>i.id==id);if(!x)return;x.dn=!x.dn;save();render()}
function tlDel(id){S.tl=(S.tl||[]).filter(i=>i.id!=id);save();render()}
function tlIdeas(){const l=(S.tl||[]).filter(x=>x.k==TLF&&!x.dn).slice(0,5).map(x=>x.n);DET=("Vreau ceva din lista mea: "+l.join(", ")+".").slice(0,200);FSEG="ideas";ADJ=true;swap();toast("Am pus lista în Detalii. Alege situația și cere idei.")}

/* plan cu prietenii: votați ideea și ora */
let POLLV=[],PSUB=null,PJ=null;
const PTIMES=["Vineri seara","Sâmbătă dimineața","Sâmbătă după-amiaza","Sâmbătă seara","Duminică"];
const pCode=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function pollSub(){
 if(PSUB||!S.poll||!DBU())return;
 try{PSUB=DB.collection("pv").onSnapshot(s=>{POLLV=s.docs.map(d=>((d.data()||{}).v||{})[UID]).filter(v=>v&&Number.isInteger(v.o));if(FSEG=="saved"&&TAB=="free")soft()},()=>{})}catch(e){}}
function pollCard(){
 if(S.poll){pollSub();const p=S.poll,n=POLLV.length;
  const cnt=(k,i)=>POLLV.filter(v=>v[k]===i).length,top=a=>a.map((x,i)=>[x,cnt(a===p.o?"o":"t",i)]);
  return `<div class="card"><div class="top"><strong>Planul votat cu prietenii</strong><span class="tag">${n} ${n==1?"vot":"voturi"}</span></div><div class="mu" style="margin-top:4px">Codul: <b style="user-select:all">${esc(p.c.slice(0,4)+"-"+p.c.slice(4))}</b>. Prietenii îl introduc în LaTimp, la Timp liber › Salvate.</div>${top(p.o).map(([x,c])=>`<div class="ar"><span>${esc(x)}</span><b>${c}</b></div>`).join("")}${p.t.length?`<div class="mu sm" style="margin-top:8px">Când</div>`+top(p.t).map(([x,c])=>`<div class="ar"><span>${esc(x)}</span><b>${c}</b></div>`).join(""):""}${n?`<div class="mu sm" style="margin-top:8px">Au votat: ${esc(POLLV.map(v=>String(v.n||"Anonim").slice(0,20)).join(", "))}</div>`:""}<div class="acts">${n?`<button onclick="pollToAgenda()">Pune câștigătorul în agendă</button>`:""}<button onclick="pollCopy()">Copiază codul</button><button class="g" onclick="pollEnd()">Închide votul</button></div></div>`}
 return `<div class="card"><strong>Alegeți împreună</strong><div class="mu" style="margin-top:4px">Pui 2–4 idei salvate la vot, prietenii aleg ideea și ora.</div><div class="acts"><button onclick="pollNew()">Pornește un vot</button><button onclick="pollJoin()">Am un cod de vot</button></div></div>`}
function pollNew(){
 if(!DBU()){toast("Votul are nevoie de conexiune la baza de date");return}
 const a=(S.saved||[]).slice(0,12);
 if(a.length<2){toast("Salvează cel puțin două idei, apoi pornește votul");return}
 openSheet(`<h2>Vot cu prietenii</h2><label>Ideile (2–4)</label>${a.map((x,i)=>`<label class="ck"><input type="checkbox" class="po" value="${i}"${i<2?" checked":""}> ${esc(x.t)}</label>`).join("")}<label>Când (opțional)</label>${PTIMES.map((t,i)=>`<label class="ck"><input type="checkbox" class="pt" value="${i}"> ${t}</label>`).join("")}<div style="margin-top:14px"><button class="btn" onclick="pollMake()">Creează votul</button><button class="btn alt" onclick="closeSheet()">Renunță</button></div><div class="note">Oricine are codul vede ideile și numele celor care au votat.</div>`,"poll")}
async function pollMake(){
 const o=[...document.querySelectorAll("#sheet .po:checked")].map(e=>(S.saved[+e.value]||{}).t).filter(Boolean).map(t=>String(t).slice(0,80)),t=[...document.querySelectorAll("#sheet .pt:checked")].map(e=>PTIMES[+e.value]);
 if(o.length<2||o.length>4){toast("Alege între 2 și 4 idei");return}
 const c=(()=>{const b=crypto.getRandomValues(new Uint8Array(8));let s="";b.forEach(x=>s+=FA[x&31]);return s})();
 try{await DB.doc("polls/"+UID).set({c,o,t,at:Date.now()});S.poll={c,o,t,at:Date.now()};POLLV=[];save();closeSheet();render();pollCopy()}
 catch(e){toast("Nu am putut crea votul")}}
function pollCopy(){if(!S.poll)return;const c=S.poll.c.slice(0,4)+"-"+S.poll.c.slice(4);try{navigator.clipboard.writeText(c).then(()=>toast("Cod copiat: "+c),()=>toast("Codul: "+c))}catch(e){toast("Codul: "+c)}}
async function pollEnd(){try{if(DBU())await DB.doc("polls/"+UID).delete()}catch(e){}S.poll=null;POLLV=[];try{PSUB&&PSUB()}catch(e){}PSUB=null;save();render();toast("Votul s-a închis")}
function pollJoin(msg,val){
 if(PJ&&!msg){pollBallot();return}
 openSheet(`<h2>Cod de vot</h2><div class="mu">Ai primit un cod de la un prieten? Îl scrii aici și votezi ideea și ora.</div><label for="pj_c">Codul</label><input id="pj_c" maxlength="12" value="${esc(val||"")}" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX" onkeydown="if(event.key=='Enter')pollFind()"><div class="note dg" role="alert">${esc(msg||"")}</div><div style="margin-top:14px"><button class="btn" onclick="pollFind()">Caută votul</button><button class="btn alt" onclick="closeSheet()">Renunță</button></div>`,"pj")}
async function pollFind(){
 const raw=($("pj_c")||{}).value||"",c=pCode(raw);
 if(!/^[A-HJ-NP-Z2-9]{8}$/.test(c)){pollJoin("Codul are 8 caractere, de forma XXXX-XXXX.",raw);return}
 if(!DBU()){pollJoin("Votul nu poate fi verificat acum.",raw);return}
 try{const s=await once(DB.collection("polls").where("c","==",c)),d=s.docs[0];
  if(!d){pollJoin("Nu am găsit niciun vot cu acest cod.",raw);return}
  const v=d.data()||{};if(!Array.isArray(v.o)||v.o.length<2){pollJoin("Votul nu mai este disponibil.",raw);return}
  PJ={u:d.id,o:v.o.slice(0,4).map(x=>String(x).slice(0,80)),t:(Array.isArray(v.t)?v.t:[]).filter(x=>PTIMES.includes(x)),c,sel:0,tm:-1};pollBallot()}
 catch(e){pollJoin("Nu am putut căuta votul. Încearcă din nou.",raw)}}
function pollBallot(){
 const p=PJ;if(!p)return;
 openSheet(`<h2>Votează</h2><label>Ce facem?</label><div class="chips">${p.o.map((x,i)=>`<button class="${p.sel==i?"on":""}" onclick="PJ.sel=${i};PJ.n=($('pj_n')||{}).value||PJ.n||'';pollBallot()">${esc(x)}</button>`).join("")}</div>${p.t.length?`<label>Când?</label><div class="chips">${p.t.map((x,i)=>`<button class="${p.tm==i?"on":""}" onclick="PJ.tm=${i};PJ.n=($('pj_n')||{}).value||PJ.n||'';pollBallot()">${esc(x)}</button>`).join("")}</div>`:""}<label for="pj_n">Numele tău</label><input id="pj_n" maxlength="20" value="${esc(p.n||(S.acct&&S.acct.n)||"")}" placeholder="Cum te știu prietenii"><div style="margin-top:14px"><button class="btn" onclick="pollVote()">Trimite votul</button><button class="btn alt" onclick="PJ=null;closeSheet()">Renunță</button></div><div class="note">Numele și votul tău le vede oricine are codul.</div>`,"pj")}
async function pollVote(){
 const p=PJ;if(!p||!DBU())return;const n=(($("pj_n")||{}).value||"").trim().slice(0,20);
 if(!n){toast("Scrie-ți numele, ca prietenii să știe cine a votat");return}
 if(p.u==UID){toast("Este votul tău. Îl vezi în Salvate.");return}
 const v={o:p.sel,t:p.tm>=0?p.tm:null,n,ts:Date.now()};
 try{const r=DB.doc("pv/"+UID),s=await r.get();if(s.exists)await r.update({v:{[p.u]:v}});else await r.set({v:{[p.u]:v}});PJ=null;closeSheet();toast("Vot trimis")}
 catch(e){toast("Nu am putut trimite votul")}}

/* recomandări: un cod personal; amândoi primiți 30 de zile de acces complet */
let REFN=0,RSUB=null;
const RFMAX=12,RFD=30;
function bonusOn(){return !!(S.bx&&S.bx>=fmt(td()))}
function bonusAdd(days){const t=fmt(td());if(!bonusOn()){S.bw=!!S.pro&&!invOn();S.bx=fmt(addD(td(),days))}else S.bx=fmt(addD(pd(S.bx),days));S.pro=true}
function bonusExp(){if(S.bx&&S.bx<fmt(td())){S.bx=null;if(!invOn())S.pro=!!S.bw;S.bw=false;store();setTimeout(()=>toast("Zilele primite prin recomandări s-au încheiat."),0)}}
function refSub(){
 if(RSUB||!S.ref||!DBU())return;
 try{RSUB=DB.collection("ru").where("by","==",UID).onSnapshot(s=>{REFN=s.docs.filter(d=>d.id!=UID).length;const g=Math.min(REFN,RFMAX)-(+S.rfg||0);if(g>0){S.rfg=(+S.rfg||0)+g;bonusAdd(g*RFD);save();toast(g==1?"Un prieten a folosit codul tău: ai primit "+RFD+" de zile.":g+" prieteni au folosit codul tău: ai primit "+g*RFD+" de zile.");soft()}else if(TAB=="more")soft()},()=>{})}catch(e){}}
async function refOpen(msg){
 if(needAcct("Ca să inviți prieteni și să primești zilele, ai nevoie de un cont.",refOpen))return;
 if(!DBU()){openSheet(`<h2>Invită un prieten</h2><div class="mu">Recomandările au nevoie de conexiune la baza de date. Aici nu sunt disponibile.</div><button class="btn alt" onclick="closeSheet()">Închide</button>`,"ref");return}
 if(!S.ref){const b=crypto.getRandomValues(new Uint8Array(7));let c="R";b.forEach(x=>c+=FA[x&31]);try{await DB.doc("rc/"+UID).set({c});S.ref=c;save()}catch(e){toast("Nu am putut crea codul");return}}
 refSub();
 const c=S.ref.slice(0,4)+"-"+S.ref.slice(4);
 openSheet(`<h2>Invită un prieten</h2><div class="mu">Când un prieten folosește codul tău, amândoi primiți ${RFD} de zile de acces complet. Cel mult ${RFMAX} prieteni.</div><div class="code">${esc(c)}</div><button class="btn" onclick="refCopy()">Copiază codul</button><div class="note">${REFN?REFN+(REFN==1?" prieten l-a folosit":" prieteni l-au folosit")+(bonusOn()?". Ai acces complet până la "+esc(nice(S.bx))+".":"."):"Încă nu l-a folosit nimeni."}</div>${S.rfu?"":`<label for="rf_c">Ai primit un cod de la un prieten?</label><div class="qa"><input id="rf_c" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="RXXX-XXXX" onkeydown="if(event.key=='Enter')refUse()"><button onclick="refUse()">Folosește</button></div>`}<div class="note dg" role="alert">${esc(msg||"")}</div><button class="btn alt" onclick="closeSheet()">Închide</button>`,"ref")}
function refCopy(){const c=S.ref.slice(0,4)+"-"+S.ref.slice(4);try{navigator.clipboard.writeText(c).then(()=>toast("Cod copiat"),()=>toast("Codul: "+c))}catch(e){toast("Codul: "+c)}}
async function refUse(){
 const c=pCode(($("rf_c")||{}).value);
 if(!/^R[A-HJ-NP-Z2-9]{7}$/.test(c)){refOpen("Codul are forma RXXX-XXXX.");return}
 if(c==S.ref){refOpen("Acesta este codul tău. Trimite-l unui prieten.");return}
 if(S.rfu){refOpen("Ai folosit deja un cod de la un prieten.");return}
 try{const s=await once(DB.collection("rc").where("c","==",c)),d=s.docs[0];
  if(!d||d.id==UID){refOpen("Nu am găsit acest cod.");return}
  const me=await DB.doc("ru/"+UID).get();if(me.exists){S.rfu=1;save();refOpen("Ai folosit deja un cod de la un prieten.");return}
  await DB.doc("ru/"+UID).set({c,by:d.id,ts:Date.now()});S.rfu=1;bonusAdd(RFD);save();closeSheet();render();toast("Gata: ai "+RFD+" de zile de acces complet.")}
 catch(e){refOpen("Nu am putut verifica codul. Încearcă din nou.")}}
function savedView(){
 const a=S.saved||[];
 return srBtn()+`<div class="hero"><div class="lb">Colecția ta</div><h2>Idei salvate</h2><div class="s">${a.length} ${a.length==1?"idee":"idei"}. Salvarea este gratuită.</div></div>`+(a.length?a.map((x,i)=>ideaCard(x,i,true)).join(""):`<div class="card"><div class="mu">Nu ai salvat nimic încă. Apasă „Salvează” la o idee și o găsești aici.</div></div>`)+pollCard()+listsView()}
</script>
<script>
/* ---------- Mai mult: cont, setări, informații, ajutor ---------- */
let RST=false,VT=0,VTT=0;
function seg(k,o){return `<div class="seg">${o.map(x=>`<button class="${S[k]==x[0]?"on":""}" onclick="set('${k}',${typeof x[0]=="number"?x[0]:"'"+x[0]+"'"})">${x[1]}</button>`).join("")}</div>`}
function set(k,v){S[k]=v;save();if(k=="theme")theme();render();if(k=="lang")langApply()}
function setStats(v){S.stats=v;if(v)touch();else{S.st={first:"",days:{},adds:0,reads:0,taps:{}};lastSt=""}save();render();toast(v?"Statisticile sunt pornite":"Statisticile sunt oprite, iar cele trimise se șterg")}
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?"acum":"acum "+m+" min"};
function more(){
 if(VIEW=="notif")return notifView();
 const row=(t,d,c,k)=>`<div class="it${k?" stk":""}"><span><b>${t}</b><div class="mu">${d}</div></span>${c}</div>`;
 const lnk=(t,fn)=>`<button class="it" onclick="${fn}"><b>${t}</b><span class="mu">›</span></button>`;
 const ext=(t,u,m)=>okUrl(u)?`<a class="it" style="color:inherit" href="${esc(u.trim())}" target="_blank" rel="noopener noreferrer"><b>${t}</b><span class="mu">›</span></a>`:lnk(t,`toast('${m}')`);
 const sy=!S.acct?(REM?"Ai o agendă salvată în cont. Conectează-te ca s-o aduci pe acest telefon.":"Doar pe acest telefon. Cu un cont o regăsești pe orice telefon."):!cloudOn()?(window.LT_WEB?"Se conectează la cont…":"Doar pe acest dispozitiv. Nu ești conectat."):DBOFF?"Doar pe acest dispozitiv. Contul tău nu poate salva copii aici.":SY.ok?"Copie salvată în cont, "+ago(SY.t):SY.ok===false?"Nu am putut salva copia. Încerc la următoarea modificare.":"Se verifică…";
 return head("Mai mult","Cont, setări și ajutor")+
 `<div class="gt">Cont și copie de siguranță</div><div class="grp">`+(S.acct?row("Cont",esc(PROV[S.acct.p]||"")+" · "+esc(S.acct.e),`<span class="acts" style="margin:0"><button onclick="acctOpen()">Gestionează</button></span>`):`<button class="it" onclick="acctOpen()"><span><b>Creează un cont sau conectează-te</b><div class="mu">Opțional. Google, Apple, Microsoft sau e-mail.</div></span><span class="mu">›</span></button>`)+row("Copie de siguranță",sy,"")+lnk("Copie într-un fișier","bkOpen()")+lnk("Restaurează achizițiile","restoreBuy()")+(DL?lnk("Exportă agenda (CSV)","exportCsv()"):"")+(invOn()?row("Acces prin invitație",invLine(),`<span class="acts" style="margin:0"><button onclick="invOpen()">Detalii</button></span>`):lnk("Ai un cod de invitație?","invOpen()"))+`<button class="it" onclick="refOpen()"><span><b>Invită un prieten</b><div class="mu">${bonusOn()?"Acces complet până la "+esc(nice(S.bx)):"Amândoi primiți "+RFD+" de zile de acces complet."}</div></span><span class="mu">›</span></button>`+lnk("Anul tău în LaTimp","yrShow()")+`</div>
 <div class="note">Dacă te conectezi pe alt dispozitiv, agenda se regăsește. Dacă ai modificat-o în două locuri, rămâne ultima modificare.</div>
 <div class="gt">Setări</div><div class="grp">`+
 row("Temă","Cum arată aplicația",seg("theme",[["auto","Auto"],["light","Zi"],["dark","Noapte"]]))+
 row("Limba","Language",`<div class="seg" data-nt>${[["ro","Română"],["en","English"]].map(x=>`<button class="${(S.lang||"ro")==x[0]?"on":""}" onclick="set('lang','${x[0]}')">${x[1]}</button>`).join("")}</div>`)+

 `<button class="it" onclick="notifGo()"><span><b>Notificări</b><div class="mu">${esc(remSum())}</div></span><span class="mu">›</span></button>`+
 row("Statistici de utilizare","Câte termene ai, când revii, ce sugestii deschizi. Fără conținutul agendei.",`<button class="sw${S.stats?" on":""}" role="switch" aria-checked="${!!S.stats}" aria-label="Statistici de utilizare" onclick="setStats(${!S.stats})"></button>`)+
 row("Idei și cadouri",S.aiq?"Ai dat acordul. Ce scrii pentru idei și cadouri este trimis către un serviciu de inteligență artificială.":"Acordul se cere la prima idee.",S.aiq?`<span class="acts" style="margin:0"><button onclick="aiOff()">Retrage</button></span>`:`<span class="mu">Nedat</span>`)+
 row("Citire din poză",S.aic?"Ai dat acordul. Poza aleasă este trimisă către un serviciu de inteligență artificială, ca să fie citită.":"Acordul se cere la prima poză citită.",S.aic?`<span class="acts" style="margin:0"><button onclick="setAic()">Retrage</button></span>`:`<span class="mu">Nedat</span>`)+
 `</div><div class="gt">Afișare</div><div class="grp">`+uiRows()+`</div><div class="gt">Securitate</div><div class="grp">`+lockRows()+`</div><div class="gt">Informații</div><div class="grp">
 <details><summary>Cum funcționează</summary><p>Agenda ține la un loc abonamentele, termenele auto (ITP, RCA, rovinietă, ulei) și zilele importante. Primești alertă înainte de fiecare termen. În Timp liber găsești idei de activități și de cadouri.</p></details>
 <details><summary>Ce se întâmplă cu datele mele</summary><p>Agenda se salvează pe acest dispozitiv. Dacă ești conectat, o copie se păstrează în contul tău, ca s-o regăsești pe alt dispozitiv. Când ceri idei sau citești o poză, textul sau poza sunt trimise către un serviciu de inteligență artificială, care le procesează ca să-ți răspundă. Poza nu este păstrată de aplicație. Nu scrie în Detalii CNP, numere de card sau alte date sensibile, iar în poze acoperă-le.</p></details>
 <details><summary>Cum sunt generate ideile</summary><p>Când serviciul de inteligență artificială este pornit, ideile și sugestiile de cadouri vin de la el, pe baza detaliilor tale; altfel vin dintr-o listă pregătită de noi. Sunt propuneri, nu recomandări verificate. Serviciul nu alege linkuri și nu stabilește prețuri: căutările pentru cadouri sunt create de aplicație.</p></details>
 <details><summary>Sponsorizat, afiliat, exemplu</summary><p>„Sponsorizat” înseamnă că un partener plătește pentru loc. „Link afiliat” înseamnă că aplicația poate primi un comision, fără cost în plus pentru tine. „Exemplu” marchează un loc care încă nu are partener.</p></details>
 <details><summary>Cum se calculează economia</summary><p>Adunăm costul lunar al abonamentelor marcate „de anulat”. Pentru cele anuale împărțim prețul la 12.</p></details>
 <details><summary>Statisticile de utilizare</summary><p>Dacă le pornești, aplicația păstrează cifre: câte termene ai, în ce zile ai deschis-o și ce tipuri de sugestii ai deschis. Nu păstrează numele termenelor. Sunt legate de un identificator tehnic, nu de numele tău. Când le oprești, se șterg.</p></details></div>
 <div class="gt">Ajutor</div><div class="grp">`+
 (CFG.flags.rep!==false?lnk("Raportează o problemă","reportOpen()"):"")+
 (okUrl(CFG.f.terms)?ext("Termeni și condiții",CFG.f.terms,""):lnk("Termeni și condiții","legal('terms')"))+(okUrl(CFG.f.priv)?ext("Politica de confidențialitate",CFG.f.priv,""):lnk("Politica de confidențialitate","legal('priv')"))+
 `</div>`+
 `<div class="gt">Date</div><div class="grp"><button class="it dg" onclick="wipe()"><b>${RST?"Apasă din nou ca să ștergi tot":"Șterge toate datele"}</b></button></div>
 <div class="mu" style="text-align:center;margin:20px 0">LaTimp, versiune ${window.LT_WEB?"de test":"prototip"} ${VER}<br>${S.items.filter(x=>!x.ex).length} termene în agendă</div>`}
async function wipe(){
 if(!RST){RST=true;render();setTimeout(()=>{RST=false;if(TAB=="more")render()},4000);return}

 try{un=q.onSnapshot(s=>fin(res,s),e=>fin(rej,e||new Error("err")));if(done){try{un&&un()}catch(e){}}}catch(e){fin(rej,e)}})}

async function invGo(){

 if(!IVRE.test(c)){invOpen("Codul nu arată corect. Are forma LT-XXXXX-XXXXX.",raw);return}

  const h=await invHash(c),cs=await DB.doc("codes/"+h).get();

 const best=a=>{let b=-1,bi=-1;a.forEach((x,i)=>{const c=POLLV.filter(v=>(a===p.o?v.o:v.t)===i).length;if(c>b){b=c;bi=i}});return b>0?bi:-1};

<script>

/* pornire pe profil: spui ce ai, aplicația propune termenele potrivite */

const PSUG={car:[["auto","itp"],["auto","rca"],["auto","rov"],["auto","ulei"]],apt:[["fac","cur"],["fac","int"],["casa","pad"],["casa","cen"]],house:[["fac","cur"],["fac","gaz"],["casa","pad"],["casa","cen"],["casa","cos"]],rent:[["fac","chi"],["fac","cur"]],kids:[["san","med"],["per","zi"]],pet:[["san","vac"],["san","dep"],["san","vet"]]};

 (p.sel||[]).forEach(k=>(PSUG[k]||[]).forEach(([g,t])=>{const id=g+":"+t;if(seen.has(id))return;seen.add(id);if((p.skip||[]).includes(id))return;if(S.items.some(x=>!x.ex&&x.g==g&&x.t==t))return;out.push({g,t,id})}));return out}
function profCard(){
 const p=S.prof||{};if(p.hide)return"";
 if(!(p.sel||[]).length)return `<div class="card xs"><div class="top"><strong>Ce să urmărim pentru tine?</strong><button class="x" aria-label="Ascunde" onclick="profHide()">✕</button></div><div class="mu" style="margin-top:4px">Spune ce ai (mașină, casă, animal) și îți propunem termenele potrivite. Tu completezi doar datele.</div><div class="acts"><button onclick="profOpen()">Alege</button></div></div>`;
 const l=profSugs();if(!l.length)return"";
 return `<div class="card pfl"><div class="top"><strong>De completat</strong><button class="x" aria-label="Ascunde lista" onclick="profHide()">✕</button></div><div class="mu" style="margin-top:4px">Termene propuse după profilul tău. Adaugă-le pe cele care te privesc.</div>${l.slice(0,12).map(s=>`<div class="ar"><span>${esc(TYN[s.t]||GN[s.g])}${PAIDG.includes(s.g)&&!S.pro?` <span class="tag k">Control</span>`:""}</span><span class="acts" style="margin:0"><button onclick="profAdd('${s.id}')">Adaugă</button><button class="g" onclick="profSkip('${s.id}')">Nu</button></span></div>`).join("")}<div class="acts"><button onclick="profOpen()">Schimbă profilul</button></div></div>`}
function profOpen(){PSEL=((S.prof||{}).sel||[]).slice();profDraw()}

function profSave(){S.prof=Object.assign({skip:[]},S.prof||{},{sel:PSEL.slice(),hide:false});save();closeSheet();FIL="all";render();const n=profSugs().length;toast(n?"Am pregătit "+n+(n==1?" termen de completat":" termene de completat"):"Ai deja tot ce se potrivește")}
function profHide(){S.prof=Object.assign({sel:[],skip:[]},S.prof||{},{hide:true});save();swap()}

 if(PAIDG.includes(g)&&!S.pro){toast(GN[g]+" fac parte din Control.");openPlan("agenda");return}
 if(!S.pro&&S.items.filter(x=>!x.ex).length>=FREE_ITEMS){toast("Ai atins limita gratuită de "+FREE_ITEMS+" de termene.");openPlan("agenda");return}
 const rep=XT[g]?(XT[g].find(a=>a[0]==t)||[0,0,0])[2]:((g=="auto"?AT:PT).find(a=>a[0]==t)||[0,0])[1];
 cur={g,t,n:"",d:"",rep,note:"",p:"",auto:g=="per"&&rep>0};drawItem(false)}

const STP={itp:["Programare la stație","Talonul și cartea mașinii","Plata"],rca:["Compară oferte","Plătește polița","Păstrează polița"],rov:["Cumpără de pe site-ul oficial","Păstrează dovada plății"],ulei:["Programare la service","Ulei și filtre"],rev:["Programare la service","Lista de verificat"],pas:["Programare online","Poze și acte","Taxa"],ci:["Programare","Acte"],pc:["Fișa medicală","Programare"],cb:["Verifică dacă a sosit cardul nou","Activează cardul"],imp:["Verifică suma la primărie","Plătește"],imp2:["Plătește a doua rată"],du:["Adună actele","Completează declarația","Plătește"],cen:["Sună firma de service","Programează vizita"],pad:["Compară oferte","Plătește polița"],den:["Programare"],vac:["Programare la veterinar","Carnetul de sănătate"]};
function stepBox(c){
 if(!c.id)return"";const x=S.items.find(i=>i.id==c.id);if(!x)return"";

 if(!S.pro)return `<label>Pași (Control)</label><div class="note">Împarte termenul în pași mici, de bifat pe rând.</div>`;
 const sug=(STP[x.t]||[]).filter(t=>!l.some(s=>s.t==t));
 return `<label>Pași</label>${l.map((s,i)=>`<div class="it tli" style="padding:6px 0"><label class="ck" style="margin:0"><input type="checkbox"${s.dn?" checked":""} onchange="stepTg(${i})"> <span${s.dn?' class="mu" style="text-decoration:line-through"':""}>${esc(s.t)}</span></label><button class="x" aria-label="Scoate pasul" onclick="stepDel(${i})">✕</button></div>`).join("")}${sug.length?`<div class="chips">${sug.map(t=>`<button onclick="stepAdd(${JSON.stringify(t).replace(/"/g,"&quot;")})">+ ${esc(t)}</button>`).join("")}</div>`:""}<div class="qa"><input id="st_n" maxlength="60" placeholder="Pas nou" aria-label="Pas nou" onkeydown="if(event.key=='Enter')stepAdd()"><button onclick="stepAdd()">Adaugă</button></div>`}
function stepItem(){return S.items.find(i=>i.id==cur.id)}
function stepAdd(t){const x=stepItem();if(!x)return;grab();const v=(t||(($("st_n")||{}).value||"")).trim().slice(0,60);if(!v){toast("Scrie pasul");return}x.ss=(Array.isArray(x.ss)?x.ss:[]).concat({t:v,dn:false}).slice(0,12);cur.ss=x.ss;save();drawItem(true)}
function stepTg(i){const x=stepItem();if(!x||!x.ss[i])return;grab();x.ss[i].dn=!x.ss[i].dn;cur.ss=x.ss;save();drawItem(true)}
function stepDel(i){const x=stepItem();if(!x)return;grab();x.ss.splice(i,1);cur.ss=x.ss;save();drawItem(true)}

}

<script>

/* rapoarte: se trimit în fila Rapoarte din panou, cu captură opțională; răspunsurile apar în aplicație */

if(WEB){
 drawReport=function(msg){

  if(can)h+=`<label for="rs">Captură de ecran (opțional)</label><input id="rs" type="file" accept="image/png,image/jpeg,image/webp" onchange="repShot(this.files[0])"><div class="note" id="rss">${SHOT?"Captură atașată ("+Math.round(SHOT.size/1024)+" KB)":""}</div><div class="sg"><b>Atenție la datele personale</b>Captura poate conține nume, numere sau adrese. Acoperă-le înainte. O vede doar echipa aplicației.</div>`;
  else h+=`<div class="note">${SB?"Ca să trimiți un raport și să primești răspuns, conectează-te la cont.":"Trimiterea are nevoie de internet."}</div>`;

  openSheet(h+`<div style="margin-top:14px">${can?`<button class="btn" onclick="repSend()"${RBUSY?" disabled":""}>${RBUSY?"Se trimite…":"Trimite raportul"}</button>`:SB?`<button class="btn" onclick="repGrab();acctOpen('Ca să trimiți un raport și să primești răspuns, ai nevoie de un cont.',()=>drawReport())">Conectează-te</button>`:""}<button class="btn alt" onclick="closeSheet()">Renunță</button></div>`,"rep")};
 repSend=async function(){
  repGrab();const tx=RTXT.trim();
  if(tx.length<5){toast("Scrie câteva cuvinte");return}
  if(Date.now()-LASTR<20000){toast("Așteaptă puțin înainte de alt raport");return}
  RBUSY=true;drawReport();
  try{
   let sp=null;
   if(SHOT){try{const p=SBU.id+"/"+Date.now().toString(36)+(SHOT.type=="image/png"?".png":".jpg");const{error}=await SB.storage.from("report-shots").upload(p,SHOT,{contentType:SHOT.type||"image/jpeg",upsert:false});if(!error)sp=p}catch(e){}}
   const{error}=await SB.from("reports").insert({user_id:SBU.id,kind:RKS[RK]||"other",body:tx.slice(0,2000),meta:{v:VER,tab:TAB,w:innerWidth+"x"+innerHeight,lang:S.lang||"ro",platform:plat()},shot_path:sp});
   if(error)throw error;
   LASTR=Date.now();RBUSY=false;const nos=SHOT&&!sp;SHOT=null;closeSheet();toast(nos?"Raport trimis, dar fără captură":"Raport trimis, mulțumim. Răspunsul apare în Mai mult.")}
  catch(e){RBUSY=false;drawReport(e&&/Prea multe/.test(e.message||"")?"Ai trimis multe rapoarte în ultima oră. Încearcă mai târziu.":"Nu am putut trimite raportul. Încearcă din nou.")}};
}
async function rplLoad(){if(!SB||!SBU){RPL=[];return}try{const{data}=await SB.from("reports").select("id,kind,body,reply,replied_at,created_at").not("reply","is",null).order("replied_at",{ascending:false}).limit(20);RPL=Array.isArray(data)?data.filter(r=>r.reply):[];softMore()}catch(e){}}
const rplNew=()=>RPL.filter(r=>!S.rps||String(r.replied_at)>String(S.rps)).length;
function rplOpen(){
 openSheet(`<h2>Răspunsuri la rapoarte</h2>${RPL.map(r=>`<div class="card" style="margin-top:12px"><div class="mu sm">Ai scris${r.created_at?" pe "+esc(nice(String(r.created_at).slice(0,10)).replace(/\.$/,"")):""}:</div><div style="margin:4px 0 10px">${esc(String(r.body).slice(0,300))}</div><div class="mu sm">Răspunsul echipei:</div><div>${esc(String(r.reply).slice(0,1000))}</div></div>`).join("")}<button class="btn alt" style="margin-top:14px" onclick="closeSheet()">Închide</button>`,"rpl");
 if(RPL.length){S.rps=RPL[0].replied_at;store();softMore()}}
if(WEB){
 const mo1=more;
 more=function(){const h=mo1();if(VIEW!="main"||!RPL.length)return h;const n=rplNew(),i=h.indexOf('<div class="gt">');
  const c=`<button class="card rowc" onclick="rplOpen()"><span><strong>${n?"Ai "+(n==1?"un răspuns nou":n+" răspunsuri noi"):"Răspunsuri la rapoarte"}</strong><span class="mu"> · de la echipa LaTimp</span></span><span class="mu" aria-hidden="true">›</span></button>`;

 const s=S.st||{},t=s.taps||{},a=typeof accNow=="function"?accNow():{},d={v:VER,platform:plat(),first:s.first||"",days:Object.keys(s.days||{}).length,items:S.items.filter(x=>!x.ex).length,adds:s.adds||0,reads:s.reads||0,push:S.nt&&S.nt.push?1:0,lang:S.lang||"ro"};
 Object.keys(t).slice(0,40).forEach(k=>{if(/^[a-z_]{2,24}$/.test(k)&&+t[k]>0)d[k]=+t[k]});
 if(a.ab&&a.ab.group)d.ab=a.ab.group;
 const j=JSON.stringify(d);if(j==ustSync.last)return;
 try{const{error}=await SB.from("usage_stats").upsert({user_id:SBU.id,data:d,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(!error){ustSync.last=j;ustSync.on=true}}catch(e){}},8000);

<script>
/* ---------- Vot cu prietenii și familie prin Supabase (doar în versiunea web) ---------- */
const onCloud=()=>!!(SB&&SBU);
/* vot: votul tău se citește la intrarea în Salvate și la fiecare 30 de secunde cât stai acolo */
async function pvLoad(){
 if(!onCloud()||!S.poll)return;
 try{const{data,error}=await SB.from("poll_votes").select("opt,tm,name").eq("poll_owner",SBU.id);if(error)throw error;
  const v=(data||[]).map(r=>({o:r.opt,t:r.tm,n:r.name}));if(JSON.stringify(v)!=JSON.stringify(POLLV)){POLLV=v;if(FSEG=="saved"&&TAB=="free")soft()}}catch(e){}}
if(WEB){
 pollSub=function(){if(!S.poll||!onCloud())return;if(!pollSub.t){pollSub.t=setInterval(()=>{if(document.visibilityState=="visible"&&TAB=="free"&&FSEG=="saved"&&S.poll)pvLoad()},30000);pvLoad()}};
 pollNew=function(){
  if(needAcct("Ca să pornești un vot, ai nevoie de un cont. Așa vezi voturile prietenilor.",pollNew))return;
  if(!SB){toast("Votul are nevoie de internet");return}
  const a=(S.saved||[]).slice(0,12);
  if(a.length<2){toast("Salvează cel puțin două idei, apoi pornește votul");return}
  openSheet(`<h2>Vot cu prietenii</h2><label>Ideile (2–4)</label>${a.map((x,i)=>`<label class="ck"><input type="checkbox" class="po" value="${i}"${i<2?" checked":""}> ${esc(x.t)}</label>`).join("")}<label>Când (opțional)</label>${PTIMES.map((t,i)=>`<label class="ck"><input type="checkbox" class="pt" value="${i}"> ${t}</label>`).join("")}<div style="margin-top:14px"><button class="btn" id="pm_go" onclick="pollMake()">Creează votul</button><button class="btn alt" onclick="closeSheet()">Renunță</button></div><div class="note">Oricine are codul vede ideile; numele celor care au votat le vezi doar tu.</div>`,"poll")};
 pollMake=async function(){
  const o=[...document.querySelectorAll("#sheet .po:checked")].map(e=>(S.saved[+e.value]||{}).t).filter(Boolean).map(t=>String(t).slice(0,80)),t=[...document.querySelectorAll("#sheet .pt:checked")].map(e=>PTIMES[+e.value]);
  if(o.length<2||o.length>4){toast("Alege între 2 și 4 idei");return}
  const b=$("pm_go");if(b){b.disabled=true;b.textContent="Se creează…"}
  try{const{data,error}=await SB.rpc("open_poll",{p_options:o,p_times:t});if(error||!data||!data.code)throw error;
   S.poll={c:data.code,o,t,at:Date.now()};POLLV=[];save();closeSheet();render();pollCopy()}
  catch(e){if(b){b.disabled=false;b.textContent="Creează votul"}toast("Nu am putut crea votul. Încearcă din nou.")}};
 pollEnd=async function(){try{if(onCloud())await SB.from("polls").delete().eq("owner",SBU.id)}catch(e){}S.poll=null;POLLV=[];save();render();toast("Votul s-a închis")};
 pollFind=async function(){
  const raw=($("pj_c")||{}).value||"",c=pCode(raw);
  if(!/^[A-HJ-NP-Z2-9]{8}$/.test(c)){pollJoin("Codul are 8 caractere, de forma XXXX-XXXX.",raw);return}
  if(needAcct("Ca să votezi, ai nevoie de un cont. Așa fiecare votează o singură dată.",()=>pollJoin("",raw)))return;
  if(!SB){pollJoin("Votul nu poate fi verificat acum. Conectează-te la internet.",raw);return}
  try{const{data,error}=await SB.rpc("find_poll",{p_code:c});if(error)throw error;
   if(!data||!Array.isArray(data.options)||data.options.length<2){pollJoin("Nu am găsit niciun vot cu acest cod.",raw);return}
   if(data.mine){closeSheet();FSEG="saved";render();toast("Este votul tău. Îl vezi aici, în Salvate.");return}
   PJ={u:"x",o:data.options.slice(0,4).map(x=>String(x).slice(0,80)),t:(Array.isArray(data.times)?data.times:[]).map(x=>String(x).slice(0,20)),c,sel:0,tm:-1};pollBallot()}
  catch(e){pollJoin("Nu am putut căuta votul. Încearcă din nou.",raw)}};
 pollVote=async function(){
  const p=PJ;if(!p)return;const n=(($("pj_n")||{}).value||"").trim().slice(0,20);
  if(!n){toast("Scrie-ți numele, ca prietenii să știe cine a votat");return}
  try{const{data,error}=await SB.rpc("vote_poll",{p_code:p.c,p_opt:p.sel,p_tm:p.tm>=0?p.tm:null,p_name:n});if(error||!data)throw error;
   if(!data.ok){const E={invalid:"Votul nu mai este disponibil.",own:"Este votul tău. Îl vezi în Salvate.",rate:"Prea multe încercări. Mai așteaptă un minut."};toast(E[data.err]||"Nu am putut trimite votul.");return}
   PJ=null;closeSheet();toast("Vot trimis")}
  catch(e){toast("Nu am putut trimite votul. Încearcă din nou.")}};
}
/* familie: același pachet criptat pe telefon, păstrat în family_blobs (serverul vede doar amprenta codului) */
let FAMT=0;
async function famPull(){
 if(!onCloud()||!S.fam||!FKEY||!FH)return;const tk=FTK;
 try{const{data,error}=await SB.from("family_blobs").select("user_id,blob").eq("group_hash",FH);if(error)throw error;
  const out=[];for(const r of data||[]){if(r.user_id==SBU.id)continue;try{const p=await decr(FKEY,r.blob);out.push({u:r.user_id,w:clip(p.w,30),it:(Array.isArray(p.it)?p.it:[]).slice(0,100),gc:(Array.isArray(p.gc)?p.gc:[]).slice(0,50)})}catch(e){}}
  if(tk!=FTK)return;if(JSON.stringify(out)!=JSON.stringify(FAMV)){FAMV=out;soft()}}catch(e){}}
const famPush=writer(async()=>{
 if(!onCloud()||!S.fam||!FKEY)return;
 const it=S.items.filter(x=>x.sh&&x.g!="sub").slice(0,100).map(x=>({n:ttl(x),d:x.d,t:x.t,g:x.g,rep:x.rep||0,a:x.auto?1:0})),gc=famGifts(),sig=JSON.stringify([FH,S.fam.who,it,gc]);
 if(sig==lastFam)return;
 const b=await encr(FKEY,{w:S.fam.who,it,gc});
 const{error}=await SB.from("family_blobs").upsert({user_id:SBU.id,group_hash:FH,blob:b,updated_at:new Date().toISOString()},{onConflict:"user_id"});
 if(!error){lastFam=sig;famPull()}},1500);
if(WEB){
 famSetup=async function(){
  const tk=++FTK;FAMV=[];FKEY=null;FH="";
  if(!S.fam||!onCloud()||!cryptoOk())return;
  try{const d=await derive(S.fam.code);if(tk!=FTK)return;FKEY=d.key;FH=d.h;lastFam="";famPush();await famPull()}catch(e){}};
 famOpen=function(){FM={};
  if(!S.pro){toast("Familia face parte din Control.");openPlan("agenda");return}
  if(needAcct("Pentru familie ai nevoie de un cont, ca să vă găsiți unii pe alții.",famOpen))return;
  if(!cryptoOk()||!SB){openSheet(`<h2>Familie</h2><div class="mu">Familia are nevoie de internet. Încearcă din nou când ești online.</div><button class="btn alt" onclick="closeSheet()">Închide</button>`,"fam");return}
  drawFam()};
 famLeave=async function(){
  if(!FM.leave){FM.leave=1;drawFam();return}
  FM={};S.fam=null;S.items.forEach(x=>{delete x.sh});lastFam="";save();
  if(onCloud()){try{await SB.from("family_blobs").delete().eq("user_id",SBU.id)}catch(e){}}
  await famSetup();closeSheet();render();toast("Ai ieșit din familie")};
 const sv4=save;save=function(){sv4();famPush()};
 const aL3=accLoad;accLoad=async function(){await aL3();if(S.fam&&!FKEY)famSetup();else famPull();if(S.poll)pvLoad()};
 addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"){famPull();if(TAB=="free"&&FSEG=="saved")pvLoad()}});
 const ao3=acctOut;acctOut=async function(){const r=await ao3();if(!S.acct){FTK++;FAMV=[];FKEY=null;FH=""}return r};
}
</script>

  en:[
   ["Who we are","LaTimp is an app for due dates, payments and free time. The data controller is {op}{ad}. For any question about your data, write to {ml}."],
   ["What data we use",["<b>Account:</b> the email address you sign in with. The account is optional; without it everything stays on your phone.","<b>Agenda:</b> due dates, amounts, notes, people and gifts, lists, settings. You enter them and we use them only to show your agenda and send your reminders.","<b>Phone reminders:</b> if you turn them on, we keep the technical address your phone uses to receive notifications and your reminder schedule (the item's title, date and time).","<b>Family:</b> the dates you choose to share are encrypted on your phone with the family code before they leave it. The server only receives encrypted text and a fingerprint of the code; we cannot read them.","<b>Ideas, gifts and photo reading:</b> when you ask for them, the details you type (for example who you go out with, the budget, who the gift is for) or the photo of the document go through our server to the artificial intelligence service, which replies with suggestions or the fields it read. We don't send the rest of your agenda and don't keep the photo.","<b>Near me:</b> only when you tap “Use my location”, the phone sends an approximate position (rounded to about 1 km). The exact position stays on the phone, and the results are kept only on the phone. When the search service does not answer, the search goes through our server, which keeps the results for that area for 7 days, not linked to you.","<b>The self-updating calendar:</b> if you create the link, we keep a copy of the calendar file (titles, dates, notes and reminders of your items) so your calendar can read it. Anyone with the link can read it; you can turn it off at any time.","<b>Votes with friends:</b> the ideas put to the vote, the name you type when voting and your choice.","<b>Reports:</b> the text you send, the screenshot if you attach one, and technical details (app version, screen size, device type).","<b>Errors:</b> the technical error message, the version and device type, without your agenda. Email addresses in the message are removed before sending.","<b>Usage statistics:</b> only if you turn them on in More. They are numbers (for example how many dates you have and on how many days you used the app), without your agenda.","<b>Technical connection data:</b> your IP address and browser type reach the providers that deliver the app, for operation and security."]],
   ["Where it is kept",["On your phone, in the app's storage.","If you have an account: at Supabase, in the Frankfurt data centre (Germany, European Union): the database, attached files and server functions.","The app's code is hosted on GitHub Pages."]],
   ["Who else receives it",["<b>Supabase</b> (database, accounts, files, server functions), in the EU.","<b>GitHub</b> (hosting the app and its font) and <b>jsDelivr</b> (the server connection library) receive your IP address when the app loads.","<b>Google</b> delivers the sign-in emails (code or link).","<b>Your phone's notification service</b> (Google for Android and Chrome, Apple for iPhone, Mozilla for Firefox) delivers the reminders, encrypted.","Some of these providers are outside the EU (United States). Transfers rely on the EU–US Data Privacy Framework or standard contractual clauses.","<b>The artificial intelligence service</b> (a provider in the United States) receives the request text or the photo only when you ask for ideas, gifts or photo reading. By contract it does not use them for training and keeps them only for a limited time.","<b>Photon</b> (komoot's search service, Germany, with OpenStreetMap data) receives the approximate position when you look for places near you: directly from your phone, with your IP address, and if it does not answer, through our server, without your IP address. Place data is © OpenStreetMap contributors.","<b>Your calendar</b> (for example Google Calendar, Apple Calendar or Outlook) reads the calendar file from our server, if you add the link.","We don't sell data and don't use it for advertising."]],
   ["Why we use it (legal basis)",["To provide the service you asked for: the agenda, the account, reminders, family, votes, ideas and nearby places, the subscribed calendar (performance of the contract).","With your consent: usage statistics and the artificial intelligence features (ideas, gifts, photo reading). You can withdraw it at any time in More.","For security, abuse prevention and fixing errors (legitimate interest)."]],
   ["How long we keep it",["Account data, as long as you have an account. “Delete account” in More removes from the server your account, agenda, reminders, notification subscriptions, family, votes and files.","Sent reminders are deleted after at most 30 days.","The copy for the subscribed calendar, until you turn off the link or delete your account.","Statistics are deleted when you turn them off.","Reports and errors are kept as long as needed to fix the problem.","“Delete all data” removes what is on the phone."]],
   ["Your rights",["Access, rectification, erasure, restriction, objection and portability. For portability use “Backup to a file” in More.","Withdrawing consent at any time, without affecting what was done before.","For any request write to {ml}. We answer within one month.","You can complain to the Romanian data protection authority (ANSPDCP), www.dataprotection.ro."]],
   ["Storage on your device",["The app keeps data in the browser's or phone's storage (for example your agenda and sign-in session). We don't use advertising or tracking cookies."]],
   ["Security",["The connection to the server is encrypted. Each account sees only its own data. Family data is encrypted on the phone. The app PIN stays only on your phone."]],
   ["Children",["LaTimp is not meant for children under 16."]],
   ["Changes",["If we change this policy, we will announce it in the app. Last updated: {date}."]]
  ]},
 terms:{

   ["Versiunea de test",["Aplicația este în perioada de test. Unele funcții se pot schimba, pot lipsi temporar sau pot avea erori. În această perioadă, toate funcțiile sunt gratuite."]],
   ["Contul",["Contul este opțional și se creează cu adresa de e-mail. Ai grijă ca doar tu să ai acces la e-mailul cu care te conectezi.","Poți șterge contul oricând din Mai mult."]],
   ["Memento-urile",["Memento-urile te ajută, dar nu sunt garantate: depind de telefon, de setările lui, de conexiunea la internet și de serviciile de notificări. Respectarea termenelor (plăți, documente, taxe) rămâne în grija ta.","Informațiile din aplicație (de exemplu zilele libere legale sau sugestiile) au caracter informativ. Verifică datele oficiale când e important.","Ideile, cadourile și câmpurile citite din poză sunt propuneri generate automat și pot conține greșeli: verifică-le înainte să te bazezi pe ele. Locurile din apropiere vin din OpenStreetMap și pot fi incomplete sau depășite (programul, accesul)."]],
   ["Planuri și plăți",["Unele funcții pot deveni parte din planul plătit Control (abonament) sau pot folosi Scântei (pachete cu plată unică). Prețurile, perioada de probă și modul de anulare vor fi afișate clar înainte de orice plată.","Abonamentele cumpărate prin magazinele de aplicații se anulează din contul magazinului; rambursările urmează regulile magazinului și legea.","Ca utilizator consumator, ai dreptul de retragere de 14 zile pentru serviciile digitale, cu excepțiile prevăzute de lege atunci când ai cerut începerea imediată a serviciului."]],
   ["Coduri",["Codurile de invitație și de recomandare dau acces temporar și pot fi retrase dacă sunt folosite abuziv sau după data lor de expirare."]],
   ["Folosirea corectă",["Nu folosi aplicația pentru a încălca legea sau drepturile altora, nu încerca să accesezi datele altor utilizatori și nu supraîncărca serviciul.","Nu adăuga date sensibile ale altor persoane fără acordul lor. În familie și la vot, distribui doar ce vrei să vadă ceilalți."]],
   ["Conținutul tău",["Ce scrii în aplicație rămâne al tău. Ne dai doar permisiunea să-l păstrăm și să-l prelucrăm ca să funcționeze serviciul, așa cum scrie în Politica de confidențialitate."]],
   ["Disponibilitate și răspundere",["Facem tot ce putem ca serviciul să funcționeze, dar nu putem garanta că va fi mereu disponibil sau fără erori.","Nu răspundem pentru pierderi cauzate de un memento neprimit sau de o informație orientativă, în măsura permisă de lege. Drepturile tale de consumator prevăzute de lege nu sunt limitate."]],
   ["Suspendare și încheiere",["Poți înceta oricând să folosești aplicația și poți șterge contul. Putem suspenda un cont folosit abuziv, cu informarea ta când e posibil."]],
   ["Modificări",["Schimbările importante ale acestor termeni le anunțăm în aplicație înainte să se aplice. Ultima actualizare: {date}."]],
   ["Legea și reclamațiile",["Se aplică legea română. Pentru reclamații scrie-ne întâi la {ml}. Ca și consumator, te poți adresa și Autorității Naționale pentru Protecția Consumatorilor (ANPC), www.anpc.ro, sau platformei europene de soluționare online a litigiilor."]]
  ],
  en:[
   ["The service","LaTimp helps you keep track of due dates and payments, sends you reminders and gives ideas for free time. The app is provided by {op}{ad}. By using the app, you agree to these terms."],
   ["Test version",["The app is in its test period. Some features may change, be temporarily missing or have errors. During this period, all features are free."]],
   ["Account",["The account is optional and is created with your email address. Make sure only you can access the email you sign in with.","You can delete the account at any time in More."]],
   ["Reminders",["Reminders help you, but they are not guaranteed: they depend on your phone, its settings, your internet connection and notification services. Meeting deadlines (payments, documents, taxes) remains your responsibility.","Information in the app (for example public holidays or suggestions) is for guidance. Check official sources when it matters.","Ideas, gifts and fields read from a photo are automatically generated suggestions and may contain mistakes: check them before relying on them. Nearby places come from OpenStreetMap and may be incomplete or out of date (opening hours, access)."]],
   ["Plans and payments",["Some features may become part of the paid Control plan (subscription) or use Sparks (one-time packs). Prices, the trial period and how to cancel will be shown clearly before any payment.","Subscriptions bought through app stores are cancelled from your store account; refunds follow the store's rules and the law.","As a consumer, you have a 14-day right of withdrawal for digital services, with the exceptions set by law when you asked for the service to start immediately."]],

   ["Your content",["What you write in the app stays yours. You only allow us to keep and process it so the service works, as described in the Privacy policy."]],

 return{op:(o=>lg=="en"?o.replace("(persoană fizică)","(private individual)"):o)(t(L.operator||f.co_n))||(lg=="en"?"the operator of the LaTimp app":"operatorul aplicației LaTimp")+" "+F,ad:(a=>a?(lg=="en"?", registered at ":", cu sediul la ")+a:"")(t(L.address||f.co_a)),ml:t(L.email||f.mail)||F}}

function wkPlan(){
 if(!S.pro||!S.nt||!S.nt.wk)return[];
 const out=[],now=Date.now(),en=S.lang=="en",pz=typeof pauseOn=="function"&&pauseOn()?+pd(S.np)+DAY:0,[h,m]=ntH().split(":").map(Number);
 const d0=new Date();d0.setHours(h,m,0,0);d0.setDate(d0.getDate()+((8-d0.getDay())%7));
 for(let w=0;w<9;w++){
  const at=new Date(d0);at.setDate(d0.getDate()+7*w);const t=+at;if(t<=now+60000||t>now+60*DAY||t<pz)continue;
  const st=new Date(at);st.setHours(0,0,0,0);const en0=+st+7*DAY;
  const l=S.items.filter(x=>!x.ex&&okDate(x.d)&&+pd(x.d)>=+st&&+pd(x.d)<en0).sort((a,b)=>+pd(a.d)-+pd(b.d));
  if(!l.length)continue;
  const n=l.slice(0,2).map(x=>String(ttl(x)||"").slice(0,40)).join(", "),r=l.length-2;
  const body=en?(l.length==1?"1 due date this week: ":l.length+" due dates this week: ")+n+(r>0?" and "+r+" more.":"."):(l.length==1?"Un termen săptămâna asta: ":l.length+" termene săptămâna asta: ")+n+(r>0?" și încă "+r+".":".");
  out.push({at:at.toISOString(),title:en?"Your week":"Săptămâna ta",body:body.slice(0,300),tag:"lt-wk-"+t})}
 return out}
if(WEB){const rp0=remPlan;remPlan=function(){return rp0().concat(wkPlan()).sort((a,b)=>a.at<b.at?-1:1).slice(0,200)}}

/* documente atașate: în contul tău (Supabase Storage, dosar privat), nu pe server public */

 if(!SB||!SBU){toast("Conectează-te la cont ca să deschizi documentul.");return}

 try{const{data,error}=await SB.storage.from(ATT_B).createSignedUrl(SBU.id+"/"+id,120);if(error||!data||!data.signedUrl)throw error;

 catch(e){if(w&&!w.closed)w.close();toast(navigator.onLine===false?"Documentul se deschide doar cu internet.":"Nu am putut deschide documentul.")}}
if(WEB){
 const ab0=attBox;attBox=function(c){
  AS=attStore();
  if(!AS&&c&&c.id){const n=(Array.isArray(c.att)?c.att.length:0);
   return `<label>Documente atașate${S.pro?"":" (Control)"}</label><div class="note">${n?"Documentele atașate le vezi după ce te conectezi la cont.":"Documentele se păstrează în contul tău, ca să le ai pe orice telefon."}</div><button class="btn alt" style="margin-top:8px" onclick="closeSheet();acctOpen('Conectează-te ca să atașezi documente. Le găsești apoi pe orice telefon.')">Conectează-te</button>`}
  return ab0(c).replace(/<a href="\/_blob\/([0-9a-f]{32})"[^>]*>/g,(_,id)=>`<a href="#" onclick="attOpen('${id}');return false">`)};
 const lim=()=>{const v=CFGW&&CFGW.plans&&CFGW.plans.limits&&+CFGW.plans.limits.attachments_max;return v>0&&v<=20?Math.round(v):3};
 const aa0=attAdd;attAdd=async function(f){
  AS=attStore();const x=S.items.find(i=>i.id==cur.id),n=x&&Array.isArray(x.att)?x.att.length:0,L=lim();
  if(f&&n>=L){const e=$("att_m");if(e)e.textContent=L==1?"Poți atașa un singur document.":"Poți atașa cel mult "+L+" documente.";return}
  return aa0(f)};
 const ad0=attDel;attDel=function(id){AS=attStore();ad0(id)};
}

/* prețurile din panou: prețul obișnuit, reducerea și varianta din testul A/B (are prioritate) */

 const p=CFGW&&CFGW.prices||{},v=ACC&&ACC.ab&&ACC.ab.variant||{},n=x=>{const r=parseFloat(String(x==null?"":x).replace(",","."));return isFinite(r)&&r>0&&r<10000?r:0};

 return{y,m,txt:String(v.text||"").slice(0,120)}}
function promoNow(){const p=CFGW&&CFGW.prices&&CFGW.prices.promo;if(!p||typeof p!="object")return null;const pct=Math.round(+p.pct);if(!(pct>0&&pct<100))return null;if(p.until&&String(p.until).slice(0,10)<fmt(td()))return null;return{pct,until:p.until?String(p.until).slice(0,10):"",label:String(p.label||"").slice(0,80)}}
if(WEB){
 const pr0=price;price=function(){const w=webPrices(),d=pr0();return[w.y||d[0],w.m||d[1]]};
}

function TXT(k,d){const l=S.lang=="en"?"en":"ro",o=TXW&&TXW[l],v=o&&typeof o[k]=="string"?o[k].trim():"";return v?v.slice(0,200):d}

<script>
